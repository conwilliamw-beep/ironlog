<style>
/* ===== Ironlog — iOS-native design system ===== */
:root{
  --t-large:34px; --t-t1:28px; --t-t2:22px; --t-t3:20px;
  --t-head:17px; --t-body:17px; --t-callout:16px; --t-sub:15px;
  --t-foot:13px; --t-cap:12px; --t-cap2:11px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --inset:16px;            /* group inset from screen edge */
  --lead:16px;             /* row leading padding */
  --r-group:12px; --r-ctl:10px;
  --tap:44px;
  --navh:44px;
  --ease:cubic-bezier(0.32,0.72,0,1);
}
:root{
  --bg:#f2f2f7; --group:#ffffff; --group-2:#f2f2f7;
  --fill:rgba(120,120,128,0.12); --fill-2:rgba(120,120,128,0.08); --fill-3:rgba(118,118,128,0.20);
  --label:#000; --label-2:rgba(60,60,67,0.60); --label-3:rgba(60,60,67,0.30);
  --sep:rgba(60,60,67,0.29);
  --accent:#b25e00; --on-accent:#fff;
  --green:#248a3d; --red:#d70015; --purple:#8944ab; --blue:#0060df;
  --bar:rgba(249,249,249,0.80);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --group:#1c1c1e; --group-2:#2c2c2e;
  --fill:rgba(120,120,128,0.24); --fill-2:rgba(120,120,128,0.16); --fill-3:rgba(118,118,128,0.32);
  --label:#fff; --label-2:rgba(235,235,245,0.60); --label-3:rgba(235,235,245,0.30);
  --sep:rgba(84,84,88,0.65);
  --accent:#ff9f0a; --on-accent:#000;
  --green:#30d158; --red:#ff453a; --purple:#bf5af2; --blue:#0a84ff;
  --bar:rgba(28,28,30,0.80);
}}
body[data-appear="light"]{--bg:#f2f2f7;--group:#fff;--group-2:#f2f2f7;--fill:rgba(120,120,128,0.12);--fill-2:rgba(120,120,128,0.08);--fill-3:rgba(118,118,128,0.20);--label:#000;--label-2:rgba(60,60,67,0.60);--label-3:rgba(60,60,67,0.30);--sep:rgba(60,60,67,0.29);--on-accent:#fff;--green:#248a3d;--red:#d70015;--purple:#8944ab;--blue:#0060df;--bar:rgba(249,249,249,0.80)}
body[data-appear="dark"]{--bg:#000;--group:#1c1c1e;--group-2:#2c2c2e;--fill:rgba(120,120,128,0.24);--fill-2:rgba(120,120,128,0.16);--fill-3:rgba(118,118,128,0.32);--label:#fff;--label-2:rgba(235,235,245,0.60);--label-3:rgba(235,235,245,0.30);--sep:rgba(84,84,88,0.65);--on-accent:#000;--green:#30d158;--red:#ff453a;--purple:#bf5af2;--blue:#0a84ff;--bar:rgba(28,28,30,0.80)}
body[data-tint="orange"]{--accent:#b25e00}body[data-tint="blue"]{--accent:#0060df}
body[data-tint="green"]{--accent:#1d7a3a}body[data-tint="red"]{--accent:#d70015}
body[data-tint="purple"]{--accent:#8944ab}body[data-tint="graphite"]{--accent:#5c5c60}
@media (prefers-color-scheme:dark){
 body[data-tint="orange"]{--accent:#ff9f0a;--on-accent:#000}body[data-tint="blue"]{--accent:#0a84ff;--on-accent:#fff}
 body[data-tint="green"]{--accent:#30d158;--on-accent:#000}body[data-tint="red"]{--accent:#ff453a;--on-accent:#fff}
 body[data-tint="purple"]{--accent:#bf5af2;--on-accent:#fff}body[data-tint="graphite"]{--accent:#aeaeb2;--on-accent:#000}}
body[data-appear="dark"][data-tint="orange"]{--accent:#ff9f0a;--on-accent:#000}
body[data-appear="dark"][data-tint="blue"]{--accent:#0a84ff;--on-accent:#fff}
body[data-appear="dark"][data-tint="green"]{--accent:#30d158;--on-accent:#000}
body[data-appear="dark"][data-tint="red"]{--accent:#ff453a;--on-accent:#fff}
body[data-appear="dark"][data-tint="purple"]{--accent:#bf5af2;--on-accent:#fff}
body[data-appear="dark"][data-tint="graphite"]{--accent:#aeaeb2;--on-accent:#000}
body[data-appear="light"][data-tint="orange"]{--accent:#b25e00;--on-accent:#fff}
body[data-appear="light"][data-tint="blue"]{--accent:#0060df;--on-accent:#fff}
body[data-appear="light"][data-tint="green"]{--accent:#1d7a3a;--on-accent:#fff}
body[data-appear="light"][data-tint="red"]{--accent:#d70015;--on-accent:#fff}
body[data-appear="light"][data-tint="purple"]{--accent:#8944ab;--on-accent:#fff}
body[data-appear="light"][data-tint="graphite"]{--accent:#5c5c60;--on-accent:#fff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;width:auto;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);color:var(--label);
  font-family:var(--f);font-size:var(--t-body);line-height:1.29;letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;letter-spacing:-0.026em}

/* ===== navigation bar (Liquid Glass functional layer) ===== */
#navbar{
  flex:0 0 auto;z-index:30;position:relative;
  background:transparent;transition:background .2s linear;
}
#navbar.stuck{
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 0.5px 0 var(--sep);
}
#navbar .nbrow{
  height:var(--navh);display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--s4);max-width:640px;margin:0 auto;gap:var(--s2);
}
#navbar .nbtitle{
  font-size:var(--t-head);font-weight:600;opacity:0;transition:opacity .18s linear;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#navbar.stuck .nbtitle{opacity:1}
.nbbtn{color:var(--accent);font-size:var(--t-body);font-weight:400;min-height:var(--tap);min-width:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;padding:0 2px;background:none}
.nbbtn svg{width:24px;height:24px;flex:0 0 auto}
#nbleft,#nbright{min-width:var(--tap);display:flex;align-items:center}
#nbright{justify-content:flex-end}
.nbbtn:active{opacity:.4}
.nbbtn.strong{font-weight:600}
.largetitle{font-size:var(--t-large);font-weight:700;line-height:1.1;padding:0 var(--inset) var(--s2);letter-spacing:-0.03em}
.largesub{font-size:var(--t-sub);color:var(--label-2);padding:0 var(--inset) var(--s3)}

/* ===== content ===== */
.wrap{
  flex:1 1 auto;min-height:0;width:100%;max-width:640px;margin:0 auto;
  padding:var(--s2) 0 var(--s8);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
/* section header — outside the group, aligned to inset */
.eyebrow{
  font-size:var(--t-foot);font-weight:400;color:var(--label-2);
  text-transform:uppercase;letter-spacing:0.05em;
  padding:var(--s5) calc(var(--inset) + var(--lead)) 6px;
}
.eyebrow.tight{padding-top:var(--s3)}
.foot{font-size:var(--t-foot);color:var(--label-2);padding:6px calc(var(--inset) + var(--lead)) 0;line-height:1.35}

/* ===== inset grouped list (no shadow — Apple doesn't) ===== */
.group{background:var(--group);border-radius:var(--r-group);margin:0 var(--inset) var(--s4);overflow:hidden}
.group.plain{background:none;margin-left:0;margin-right:0}
.card{background:var(--group);border-radius:var(--r-group);margin:0 var(--inset) var(--s4);padding:var(--s4);overflow:hidden}
.row-i{
  display:flex;align-items:center;gap:var(--s3);
  padding:11px var(--lead);min-height:var(--tap);position:relative;
  background:var(--group);
}
.row-i:active{background:var(--fill-2)}
.row-i + .row-i::before{content:"";position:absolute;top:0;left:var(--lead);right:0;height:0.5px;background:var(--sep)}
.row-i.inset-full + .row-i::before,.row-i + .row-i.inset-full::before{left:0}
.row-i .tile{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.row-i .tile svg{width:18px;height:18px}
.row-i .t{flex:1;min-width:0;font-size:var(--t-body)}
.row-i .t .sub{font-size:var(--t-foot);color:var(--label-2);margin-top:1px}
.row-i .v{font-size:var(--t-body);color:var(--label-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
  padding:11px var(--lead);min-height:var(--tap);position:relative;background:var(--group)}
.list-item + .list-item::before{content:"";position:absolute;top:0;left:var(--lead);right:0;height:0.5px;background:var(--sep)}
.list-item:active{background:var(--fill-2)}
.chev{color:var(--label-3);flex:0 0 auto;display:flex}
.chev svg{width:14px;height:14px}
.mono,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--label-2)}
.row{display:flex;align-items:center;gap:var(--s3)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}

/* ===== buttons ===== */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f)}
.btn{background:var(--fill);border-radius:var(--r-ctl);padding:0 var(--s4);min-height:var(--tap);
  font-size:var(--t-body);font-weight:500;color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
.btn:active{opacity:.5}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:var(--r-ctl)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:32px;padding:0 12px;font-size:var(--t-sub);border-radius:8px;background:var(--fill)}
.btn.plain{background:none;padding:0}
/* full-width action inside a group = borderless tinted row */
.act{display:block;width:100%;text-align:center;padding:12px var(--lead);min-height:var(--tap);
  font-size:var(--t-body);color:var(--accent);background:var(--group);position:relative}
.act:active{background:var(--fill-2)}
.act.destructive{color:var(--red)}
.act.strong{font-weight:600}
.act + .act::before,.row-i + .act::before{content:"";position:absolute;top:0;left:0;right:0;height:0.5px;background:var(--sep)}

input,select,textarea{
  font-family:var(--f);font-size:var(--t-body);background:var(--fill-2);color:var(--label);
  border:none;border-radius:var(--r-ctl);padding:11px var(--s3);width:100%;min-height:var(--tap);
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--label-2) 50%),linear-gradient(135deg,var(--label-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:var(--s8)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.fl{display:block;margin:var(--s4) 0 6px;font-size:var(--t-foot);color:var(--label-2)}

/* ===== tab bar ===== */
nav{flex:0 0 auto;z-index:40;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -0.5px 0 var(--sep);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:10px}
nav button{padding:6px 2px 2px;min-height:var(--tap);font-size:10px;font-weight:500;color:var(--label-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;letter-spacing:0}
nav button .ic{width:28px;height:28px;display:block}
nav button .ic svg{width:28px;height:28px;display:block}
nav button.on{color:var(--accent)}

/* ===== set rows ===== */
.exblock{background:var(--group);border-radius:var(--r-group);margin:0 var(--inset) var(--s4);overflow:hidden}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:10px var(--lead);position:relative}
.exhead::after{content:"";position:absolute;bottom:0;left:var(--lead);right:0;height:0.5px;background:var(--sep)}
.exhead .nm{font-size:var(--t-head);font-weight:600;letter-spacing:-0.02em}
.ss{font-size:var(--t-cap2);font-weight:600;color:var(--accent);background:var(--fill);border-radius:5px;padding:2px 6px;margin-left:6px}
.setrow{display:grid;grid-template-columns:34px 54px 1fr 1fr 40px;gap:6px;align-items:center;padding:4px var(--lead);position:relative}
.setrow::after{content:"";position:absolute;bottom:0;left:var(--lead);right:0;height:0.5px;background:var(--sep)}
.setrow:last-child::after{display:none}
.setrow.done{background:color-mix(in srgb,var(--green) 9%,transparent)}
.setrow.edit{grid-template-columns:34px 1fr 84px 40px}
.stag{font-family:var(--f-num);font-size:var(--t-sub);font-weight:600;text-align:center;border-radius:7px;
  background:var(--fill);color:var(--label-2);height:36px;display:flex;align-items:center;justify-content:center}
.stag.w{color:var(--accent)}.stag.d{color:var(--purple)}
.setrow input{padding:7px 4px;text-align:center;font-family:var(--f-num);font-size:var(--t-head);font-weight:600;
  height:36px;min-height:36px;border-radius:7px;background:var(--fill-2)}
.setrow input.ghost{color:var(--label-3)}
.chk{width:38px;height:36px;border-radius:7px;background:var(--fill);display:grid;place-items:center;color:var(--label-2)}
.chk svg{width:19px;height:19px;flex:0 0 auto}
.chk.on{background:var(--green);color:#fff}
.colhead{display:grid;grid-template-columns:34px 54px 1fr 1fr 40px;gap:6px;padding:6px var(--lead) 2px;
  font-size:var(--t-cap2);color:var(--label-2);text-transform:uppercase;letter-spacing:.03em}
.colhead.edit{grid-template-columns:34px 1fr 84px 40px}
.colhead span{text-align:center}
.prev{font-family:var(--f-num);font-size:var(--t-cap);color:var(--label-2);text-align:center;line-height:1.15;padding:4px 0;border-radius:6px}
.prev.tap{background:var(--fill-2)}
.exnote{font-size:var(--t-foot);color:var(--accent);padding:8px var(--lead);background:var(--fill-2)}

/* ===== rest bar ===== */
#rest{flex:0 0 auto;z-index:39;display:none}
#rest .inner{max-width:640px;margin:0 auto;background:var(--accent);color:var(--on-accent);
  display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:8px 12px}
#rest .t{font-family:var(--f-num);font-size:var(--t-t2);font-weight:700;line-height:1.05}
.restadj{background:rgba(255,255,255,.24);border-radius:9px;padding:0 14px;min-height:36px;min-width:54px;
  font-weight:600;font-size:var(--t-sub);color:inherit;font-family:var(--f-num)}
.restadj:active{background:rgba(255,255,255,.38)}
#rest .btn{background:rgba(255,255,255,.24);color:inherit;min-height:36px;font-weight:600}

/* ===== calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{font-size:var(--t-cap2);color:var(--label-2);text-align:center;padding-bottom:var(--s1);font-weight:600}
.cal .day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-size:var(--t-sub);color:var(--label)}
.cal .day.pad{visibility:hidden}
.cal .day.today{color:var(--accent);font-weight:700}
.cal .day.has{color:var(--on-accent);font-weight:600;background:var(--accent)}
.cal .day.has.today{outline:2px solid var(--label);outline-offset:1px}
.cal .day.has[data-l="1"]{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.cal .day.has[data-l="2"]{background:color-mix(in srgb,var(--accent) 70%,transparent)}
.cal .day.has[data-l="3"]{background:color-mix(in srgb,var(--accent) 85%,transparent)}
.cal .day .dot{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.calhead .m{font-size:var(--t-head);font-weight:600}
.calnav{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.calnav:active{background:var(--fill)}
.calnav svg{width:16px;height:16px}

/* ===== stats / misc ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:0 var(--inset) var(--s4)}
.stat{background:var(--group);border-radius:var(--r-group);padding:var(--s3)}
.stat .k{font-size:var(--t-cap2);color:var(--label-2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:var(--t-t2);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big{font-size:var(--t-large);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.05}
.pill{font-size:var(--t-foot);background:var(--fill);border-radius:99px;padding:5px 11px;color:var(--label-2)}
.pr{color:var(--accent);font-size:var(--t-foot);font-weight:500}
.mbar{height:7px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.icn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;vertical-align:-.15em}
.icn svg{width:1em;height:1em;display:block}
.prlist{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:var(--t-body)}
.prlist .icn{color:var(--accent);font-size:var(--t-callout)}

/* ---- rings & hierarchy ---- */
.ringcard{display:flex;align-items:center;gap:var(--s5);padding:var(--s5) var(--s4)}
.ringwrap{width:132px;flex:0 0 auto}
.ringlegend{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s3)}
.lg{display:flex;align-items:center;gap:var(--s2)}
.lg .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.lgk{font-size:var(--t-cap2);color:var(--label-2);text-transform:uppercase;letter-spacing:.04em}
.lgv{font-size:var(--t-t2);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.05}
.lgv span{font-size:var(--t-foot);font-weight:600;opacity:.55}
.row-i.hero{padding:var(--s4) var(--lead)}
.tile.lg{width:46px;height:46px;border-radius:11px}
.tile.lg svg{width:24px;height:24px}
.herot{font-size:var(--t-t3);font-weight:700;letter-spacing:-.02em}
.mrow{display:grid;grid-template-columns:26px 1fr auto;grid-template-areas:"g n v" ". t t";
  align-items:center;gap:0 var(--s3);margin-bottom:var(--s3)}
.mrow svg{grid-area:g}
.mrow .mn{grid-area:n;font-size:var(--t-sub)}
.mrow .mv{grid-area:v;font-size:var(--t-callout);font-weight:700;font-variant-numeric:tabular-nums}
.mrow .mtrack{grid-area:t;height:6px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:5px}
.mrow .mtrack i{display:block;height:100%;border-radius:99px}
.mrow:last-child{margin-bottom:0}
/* segmented control */
.tabs{display:flex;gap:2px;background:var(--fill-3);border-radius:9px;padding:2px;margin:0 var(--inset) var(--s4);overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font-size:var(--t-foot);font-weight:500;color:var(--label);
  padding:6px 10px;border-radius:7px;min-height:32px}
.tabs button.on{background:var(--group);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;align-items:flex-end}
.sheet.on{display:flex;animation:fade .25s var(--ease)}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;margin:0 auto;
  border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;padding:var(--s2) 0 var(--s8);
  animation:rise .3s var(--ease)}
.sheet .panel::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto var(--s3)}
.sheet .panel > h2{padding:0 var(--inset) var(--s2);font-size:var(--t-t3);font-weight:700}

let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open("ironlog",1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess=()=>{_db=r.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("kv","readonly").objectStore("kv").get(k);
    t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);
  });
}
async function idbSet(k,v){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("kv","readwrite").objectStore("kv").put(v,k);
    t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error);
  });
}

  return 120;
}

function ring(vals,size){
  // vals: [{v,goal,color,label}] outermost first
  const cx=size/2, cy=size/2;
  const sw=size*0.115, gap=size*0.035;
  let out="";
  vals.forEach((x,i)=>{
    const r=cx-sw/2-i*(sw+gap);
    const c=2*Math.PI*r;
    const pct=Math.max(0,Math.min(1.35,(x.goal? x.v/x.goal:0)));
    const dash=c*Math.min(1,pct);
    out+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="${x.color}" stroke-opacity="0.22" stroke-width="${sw.toFixed(1)}"/>`;
    if(pct>0) out+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="${x.color}" stroke-width="${sw.toFixed(1)}"
      stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;height:auto;display:block" role="img" aria-label="Weekly rings">${out}</svg>`;
}
function gauge(pct,color,size){
  const cx=size/2,r=cx-4,c=2*Math.PI*r,d=c*Math.max(0,Math.min(1,pct));
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:0 0 auto">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-opacity="0.2" stroke-width="4"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${d.toFixed(1)} ${(c-d).toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"/></svg>`;
}

function disp(kg,e){ if(kg===""||kg==null) return ""; const v=e.unit==="lb"?KG2LB(kg):kg; return Math.round(v*100)/100; }
function toKg(v,e){ if(v==="")return ""; const n=parseFloat(v); if(isNaN(n))return ""; return e.unit==="lb"?LB2KG(n):n; }
const e1rm=(kg,reps)=> reps>0? kg*(1+reps/30) : 0;

/* ---------- history lookups ---------- */
function lastSessionFor(exId,beforeId){
  const ws=S.workouts.filter(w=>w.id!==beforeId).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  for(const w of ws){ const en=w.entries.find(x=>x.exerciseId===exId && x.sets.some(s=>s.done)); if(en) return {w,en}; }
  return null;
}
function bestFor(exId){
  let bw=0,b1=0,bv=0;
  S.workouts.forEach(w=>w.entries.filter(e=>e.exerciseId===exId).forEach(en=>{
    let v=0;
    en.sets.filter(s=>s.done&&s.type!=="warmup").forEach(s=>{
      const kg=+s.weight||0,r=+s.reps||0;
      if(kg>bw)bw=kg; const o=e1rm(kg,r); if(o>b1)b1=o; v+=kg*r;
    });
    if(v>bv)bv=v;
  }));
  return {weight:bw,e1rm:b1,volume:bv};
}
function exSessions(exId){
  return S.workouts.filter(w=>w.entries.some(e=>e.exerciseId===exId&&e.sets.some(s=>s.done)))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts)
    .map(w=>{
      const en=w.entries.find(e=>e.exerciseId===exId);
      const work=en.sets.filter(s=>s.done&&s.type!=="warmup");
      const top=work.reduce((m,s)=>((+s.weight||0)>(+m.weight||0)?s:m),work[0]||{weight:0,reps:0});
      return {id:w.id,date:w.date,name:w.name,sets:work,
        topW:+top.weight||0,topR:+top.reps||0,
        vol:work.reduce((n,s)=>n+(+s.weight||0)*(+s.reps||0),0)};
    });
}
const STALL_WINDOW=90;
function stallInfo(exId){
  const h=exSessions(exId).filter(x=>daysAgo(x.date)<=STALL_WINDOW);
  if(h.length<3) return null;
  const bw=h.every(x=>x.topW===0);
  const score=x=>bw? x.topR : Math.max.apply(null,x.sets.map(s=>e1rm(+s.weight||0,+s.reps||0)).concat([0]));
  let best=-1,idx=0;
  h.forEach((x,i)=>{const v=score(x); if(v>best+1e-9){best=v;idx=i;}});
  const since=h.length-1-idx;
  return {since,best,bw,last:h[h.length-1],sessions:h.length,
    stalled: since>=4,
    bestLabel:(bw? best+" reps" : Math.round(best)+" kg est. 1RM")+" (90d)"};
}
function nextUp(){
  if(!S.routines.length) return null;

  const lastNamed=done.find(w=>S.routines.some(r=>r.name===w.name));
  if(!lastNamed) return S.routines[0];
  const i=S.routines.findIndex(r=>r.name===lastNamed.name);
  return S.routines[(i+1)%S.routines.length];
}

}

/* ---------- start a workout ---------- */
function startWorkout(routineId,short,plan,planMin){
  if(S.activeCardio){toast("Finish your cardio recording first");return;}
  const r=routineId?S.routines.find(x=>x.id===routineId):null;
  const lastAny=S.workouts.reduce((m,w)=>w.date>m?w.date:m,"");
  const gapDays=lastAny?daysAgo(lastAny):0;
  const comeback=gapDays>=7;
  const roundTo=(v,e)=>{const st=e.unit==="lb"?LB2KG(5):(e.inc||2.5);return Math.max(0,Math.round(Math.round(v/st)*st*1000)/1000);};
  let entries=(r?r.items:[]).map((it,idx)=>{
    const e=ex(it.exerciseId);
    const protectedEx=SHORT_PROTECTED.indexOf(e.primary)>=0;
    let planned=it.sets;
    if(short&&!protectedEx){
      const warm=planned.filter(x=>x.type==="warmup");
      const work=planned.filter(x=>x.type==="normal").slice(0,SHORT_SETS);
      const drops=planned.filter(x=>x.type==="drop").slice(0,1);
      planned=warm.concat(work,drops);
    }
    if(plan){
      const k=plan[idx]||0, allN=planned.filter(x=>x.type==="normal");
      planned=k?planned.filter(x=>x.type==="warmup").concat(allN.slice(0,k),k>=allN.length?planned.filter(x=>x.type==="drop"):[]):[];
    }
    const prev=lastSessionFor(it.exerciseId,null);
    const targets=planned.filter(x=>x.type==="normal");
    const topRep=targets.length?Math.max.apply(null,targets.map(t=>+t.reps||0)):0;
    const lowRep=(e.repLow!=null&&e.repLow>0)?e.repLow:Math.max(1,topRep-4);
    let hitAll=false, prevWork=[];
    if(prev){
      prevWork=prev.en.sets.filter(x=>x.done&&x.type==="normal");
      // a trimmed session only has to clear the sets it actually planned
      const need=prev.w.short? Math.min(targets.length,Math.max(SHORT_SETS,prevWork.length)) : targets.length;
      hitAll = need>0 && prevWork.length>=need &&
        targets.slice(0,need).every((t,i)=>prevWork[i] && (+prevWork[i].reps||0) >= (+t.reps||0));
    }
    const sets=planned.map((t,i)=>{
      let w="",reps=t.reps??"";
      if(prev){
        const pool=prev.en.sets.filter(x=>x.done&&x.type===t.type);
        const pp=pool[i]||pool[pool.length-1];
        if(pp){
          const pw=+pp.weight||0, pr=+pp.reps||0;
          if(t.type!=="normal"){ w=comeback?roundTo(pw*0.9,e):pw; reps=pr; }
          else if(comeback){ w=roundTo(pw*0.9,e); reps=pr; }
          else if(hitAll){ w=pw+(e.inc||2.5); reps=lowRep; }
          else { w=pw; reps=Math.min(pr+1, +t.reps||pr+1); }
        }
      }
      return {type:t.type,weight:w===""?"":w,reps,done:false,ghost:true,plan:{w:w===""?"":w,r:reps}};
    });
    return {exerciseId:it.exerciseId,superset:it.superset||"",sets,notes:""};
  });
  entries=entries.filter(en=>en.sets.length);
  S.active={id:uid(),date:todayISO(),ts:Date.now(),name:r?r.name:"Quick workout",routineId:routineId||null,
    entries,notes:"",start:Date.now(),short:!!short||!!plan,
    cooldown:(r&&r.cooldown?r.cooldown:[]).map(c=>({...c,done:false}))};
  if(plan) S.active.trimmed=planMin||true;
  if(comeback&&r) S.active.comeback=gapDays;
  save(); go("today");
  if(comeback&&r) toast(`${gapDays} days off — weights pre-filled at 90% to ease back in`);
  else if(plan) toast(`${planMin}-minute session — counts for progression`);
  else if(short) toast(`Short session — ${SHORT_SETS} sets, calves and rear delts kept full`);
  else if(entries.some(e=>e.sets.some(x=>x.weight!==""))) toast("Pre-filled — reps climb, then weight jumps");
}
function finishWorkout(){
  const a=S.active; if(!a) return;
  a.entries.forEach(en=>en.sets=en.sets.filter(s=>s.done));
  a.entries=a.entries.filter(en=>en.sets.length);
  if(!a.entries.length){ if(!confirm("No sets logged. Discard this workout?")) return; S.active=null; save(); return render(); }
  const auto=Math.round((Date.now()-a.start)/1000);
  a.durationSec=auto;
  const prs=[];
  a.entries.forEach(en=>{
    const before=bestFor(en.exerciseId);
    en.sets.filter(s=>s.type!=="warmup").forEach(s=>{
      if((+s.weight||0)>before.weight && +s.reps>0) prs.push(ex(en.exerciseId).name);
    });
  });
  S.workouts.push(a); S.active=null; save();
  toast(prs.length?`Workout saved · ${[...new Set(prs)].length} PR`:"Workout saved");
  go("history");
  if(S.settings.healthWorkouts) setTimeout(()=>sendWorkoutToHealth(a),700);
}

function unlockAudio(){
  try{
    if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); }
    if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
}
document.addEventListener("touchstart",unlockAudio,{once:false,passive:true});
document.addEventListener("click",unlockAudio,{passive:true});

function beep(times){
  if(S.settings.sound===false) return;
  unlockAudio();
  if(!audioCtx) return;
  const now=audioCtx.currentTime;
  for(let i=0;i<times;i++){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    const t=now+i*0.28;
    o.type="sine"; o.frequency.setValueAtTime(i===times-1?1100:820,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+0.24);
  }
}
function buzz(pattern){
  if(S.settings.vibrate===false) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
}
async function keepAwake(on){
  try{
    if(on&&"wakeLock" in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); }
    else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(restEnd>Date.now()) keepAwake(true);
    if(restEnd&&Date.now()>=restEnd) skipRest();
  }
});
function startRest(sec,label){
  sec=(sec==null?S.settings.restSec:sec)||0; if(!sec) return;
  document.getElementById("restlabel").textContent=label?("Rest \u00b7 "+label):"Rest";
  restEnd=Date.now()+sec*1000; restWarned=false; pushCancelled=false;
  document.getElementById("rest").style.display="block";
  pushSchedule(restEnd,label);
  keepAwake(true);
  clearInterval(restInt);
  restInt=setInterval(()=>{
    const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
    document.getElementById("resttime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(left<=10&&left>0&&!restWarned){ restWarned=true; beep(1); buzz(60); }
    if(left<=2&&!pushCancelled&&document.visibilityState==="visible"){ pushCancelled=true; pushCancel(); }
    if(left<=0){ skipRest(); beep(3); buzz([160,90,160,90,260]); toast("Rest done \u2014 next set"); }
  },250);
}
function adjustRest(delta){
  if(!restEnd) return;
  restEnd=Math.max(Date.now()+1000, restEnd+delta*1000);
  if(delta>0) restWarned=false;
  pushCancelled=false; pushSchedule(restEnd);
  const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
  document.getElementById("resttime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  buzz(25);
}
function skipRest(){
  if(restEnd&&!pushCancelled){ pushCancelled=true; pushCancel(); }
  clearInterval(restInt); restEnd=0;
  const el=document.getElementById("rest"); if(el) el.style.display="none";
  keepAwake(false);
}

const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushOn=()=>!!(S.settings.push&&S.settings.pushUrl&&S.settings.pushSub);
const pushBase=()=>String(S.settings.pushUrl||"").trim().replace(/\/+$/,"");
let restLabel="";
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);
  const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
async function saveRestLabel(label){
  try{ const c=await caches.open("ironlog-meta");
    await c.put(new URL("__rest-label",location.href).href,new Response(JSON.stringify({label:label||""}),{headers:{"Content-Type":"application/json"}})); }catch(e){}
}
function pushPost(path,extra){
  return fetch(pushBase()+path,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({sub:S.settings.pushSub},extra||{}))});
}
function pushSchedule(at,label){
  if(!pushOn()) return;
  if(label!=null){ restLabel=label; saveRestLabel(label); }
  pushPost("/schedule",{at}).catch(()=>{});
}
function pushCancel(){ if(pushOn()) pushPost("/cancel").catch(()=>{}); }
async function enablePush(){
  const url=(document.getElementById("pushurl")||{}).value;
  if(url!=null) S.settings.pushUrl=url.trim();
  if(!pushBase()){ toast("Paste your Worker address first"); return; }
  if(!isStandalone()){ toast("Open Ironlog from your Home Screen, not Safari"); return; }
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    toast("This iOS version can't do web push (needs 16.4+)"); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast("Notifications were not allowed — turn them on in Settings → Notifications → Ironlog"); return; }
    const key=(await (await fetch(pushBase()+"/vapid")).json()).publicKey;
    if(!key) throw new Error("no key");
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){ const cur=sub.options&&sub.options.applicationServerKey;
      const curB=cur?new Uint8Array(cur):null, want=b64uToBytes(key);
      if(!curB||curB.length!==want.length||curB.some((v,i)=>v!==want[i])){ await sub.unsubscribe(); sub=null; } }
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(key)});
    S.settings.pushSub=sub.toJSON(); S.settings.push=true; save(); render();
    await saveRestLabel("test");
    const r=await pushPost("/test");
    if(!r.ok) throw new Error("worker "+r.status);
    toast("Lock your phone now — a test alert arrives in 3 seconds");
  }catch(e){ console.warn(e); toast("Couldn't connect: "+(e.message||e)); }
}
async function disablePush(){
  pushCancel();
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  S.settings.push=false; S.settings.pushSub=null; save(); render(); toast("Lock-screen alerts off");
}

/* ---------- session-time model, fitted to your own logs ---------- */
function timeModel(){
  const pts=[];
  S.workouts.forEach(w=>{
    const m=(w.durationSec||0)/60; if(m<15||m>180) return;
    const s=w.entries.reduce((n,en)=>n+en.sets.filter(x=>x.done!==false&&x.type!=="warmup").length,0);
    if(s>=6) pts.push([s,m]);
  });
  // Sessions all sit in a narrow 16-28 set band, so a free regression extrapolates badly to short
  // sessions. Fix ~15 min for warm-up, setup and cool-down and take your median minutes per set.
  const P=pts.slice(-30), a=15; let b=2.3;
  if(P.length>=6){ const per=median(P.map(p=>(p[1]-a)/p[0])); if(per>=1.5&&per<=4) b=per; }
  return {a,b,n:P.length};
}
function routineSets(r,short){
  return r.items.reduce((n,it)=>{
    const w=it.sets.filter(x=>x.type==="normal").length;
    if(!short) return n+w;
    const prot=SHORT_PROTECTED.indexOf(ex(it.exerciseId).primary)>=0;
    return n+(prot?w:Math.min(w,SHORT_SETS));
  },0);
}
function estMin(sets){const m=timeModel();return Math.round(m.a+m.b*sets);}
function planFor(r,minutes){
  const m=timeModel(), budget=Math.max(4,Math.floor((minutes-m.a)/m.b));
  const cnt=r.items.map(it=>it.sets.filter(x=>x.type==="normal").length);
  const prot=r.items.map(it=>SHORT_PROTECTED.indexOf(ex(it.exerciseId).primary)>=0);
  const total=()=>cnt.reduce((a,b)=>a+b,0);
  // trim order: others to 3 sets, then calves/rear delts to 3, then others to 2, then those to 2
  const stages=[[false,3],[true,3],[false,2],[true,2]];
  let guard=0;
  while(total()>budget&&guard++<300){
    let pick=-1;
    for(const [pr,floor] of stages){
      for(let i=cnt.length-1;i>=0;i--){
        if(cnt[i]<=floor||prot[i]!==pr) continue;
        if(pick<0||cnt[i]>cnt[pick]) pick=i;
      }
      if(pick>=0) break;
    }
    if(pick<0){
      for(let i=cnt.length-1;i>=0;i--){ if(cnt[i]>0&&!prot[i]){pick=i;break;} }
      if(pick<0) break;
      cnt[pick]=0; continue;
    }
    cnt[pick]--;
  }
  return {counts:cnt,sets:total(),est:Math.round(m.a+m.b*total()),budget};
}
let tbMin=50;

function cmpSet(s,p){
  if(!p||s.weight===""||s.reps===""||s.type==="warmup") return null;
  const w=+s.weight||0,r=+s.reps||0,pw=+p.weight||0,pr=+p.reps||0;

/* ---------- strength relative to bodyweight ---------- */
function bwAt(iso){
  const b=(S.body||[]).slice().sort((a,c)=>a.date.localeCompare(c.date));
  if(!b.length) return null;
  let v=b[0].kg; for(const x of b){ if(x.date<=iso) v=x.kg; else break; }
  return v;
}
function strengthRows(){
  const ids=[...new Set(S.workouts.flatMap(w=>w.entries.map(e=>e.exerciseId)))], rows=[];
  const sc=x=>Math.max(0,...x.sets.map(s=>e1rm(+s.weight||0,+s.reps||0)));
  ids.forEach(id=>{
    const h=exSessions(id).filter(x=>daysAgo(x.date)<=120);
    if(h.length<4||h.every(x=>x.topW===0)) return;
    const recent=h.filter(x=>daysAgo(x.date)<=28);
    const old=h.filter(x=>{const d=daysAgo(x.date);return d>=49&&d<=84;});
    if(!recent.length) return;
    const base=old.length?old:[h[0]];
    if(base[0].id===recent[recent.length-1].id) return;
    const nowV=Math.max(...recent.map(sc)), thenV=Math.max(...base.map(sc));
    if(!(thenV>0)) return;
    const bwN=bwAt(todayISO()), bwT=bwAt(base[0].date)||bwN;
    const rn=bwN?nowV/bwN:null, rt=bwT?thenV/bwT:null;
    rows.push({id,name:ex(id).name,nowV,thenV,rn,rt,d:(rn&&rt)?rn/rt-1:nowV/thenV-1,raw:nowV/thenV-1,sessions:h.length});
  });
  return rows.sort((a,b)=>b.sessions-a.sessions||b.nowV-a.nowV);
}
function strengthCard(){
  const rows=strengthRows(), idx=rows.length?median(rows.map(r=>r.d)):null;
  return `<div class="card">
    <div class="eyebrow" style="padding:0">Strength per kg bodyweight · 8 weeks</div>
    ${idx!=null?`<div class="disp" style="font-size:60px;margin:8px 0 4px;color:${idx>=0?"var(--green)":"var(--red)"}">${idx>=0?"+":""}${(idx*100).toFixed(1)}%</div>
      <div class="mute" style="font-size:13px;line-height:1.35">Median change in estimated 1RM divided by bodyweight, across ${rows.length} lifts you've trained 4+ times recently. On a cut, holding this near zero means you're keeping your strength.</div>`
     :`<div class="mute" style="font-size:14px;margin-top:6px">Shows up once a lift has 4+ sessions in the last four months.</div>`}
    ${rows.length?`<div style="margin-top:12px">${rows.slice(0,12).map(r=>{const c=r.d>0.005?"up":r.d<-0.005?"down":"eq";
      return `<div class="srow" onclick="progEx='${r.id}';progTab='lifts';render()">
        <span class="sn">${esc(r.name)}</span>
        <span class="sr">${r.rn?r.rn.toFixed(2)+"×":Math.round(r.nowV)+"kg"}</span>
        <span class="sd ${c}">${r.d>=0?"+":""}${(r.d*100).toFixed(0)}%</span></div>`;}).join("")}
      <div class="mute" style="font-size:11px;margin-top:8px">Middle column: estimated 1RM as a multiple of bodyweight.</div></div>`:""}
  </div>`;
}

/* ---------- cardio ---------- */
const CT={ride:{n:"Ride",icon:"bike",c:"#64d2ff"},run:{n:"Run",icon:"run",c:"#ff375f"},walk:{n:"Walk",icon:"walk",c:"#30d158"},other:{n:"Cardio",icon:"bolt",c:"#ff9f0a"}};
let geoWatch=null, cardioTick=null, gpsAcc=null, gapNext=false, segNext=false;
function hav(a,b){
  const R=6371000,t=Math.PI/180,dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function cElapsed(c){ return (c.pausedAt||Date.now())-c.start-(c.pausedMs||0); }
function startCardio(type){
  if(S.active){toast("Finish your workout first");return;}
  if(!("geolocation" in navigator)){toast("No GPS here — log it manually");return manualCardio(type);}
  S.activeCardio={id:uid(),type,start:Date.now(),points:[],dist:0,pausedMs:0,pausedAt:null,gaps:0};
  gapNext=false; segNext=false; save(); go("today"); beginWatch();
}
function beginWatch(){
  endWatch(); gpsAcc=null;
  try{
    geoWatch=navigator.geolocation.watchPosition(onGeo,err=>{
      gpsAcc=-1; updLive();
      if(err&&err.code===1) toast("Location is blocked — allow it in Settings → Privacy → Location Services");
    },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  }catch(e){ gpsAcc=-1; }
  keepAwake(true);
  cardioTick=setInterval(updLive,1000);
}
function endWatch(){
  if(geoWatch!=null){ try{navigator.geolocation.clearWatch(geoWatch);}catch(e){} geoWatch=null; }
  clearInterval(cardioTick); cardioTick=null;
}
function onGeo(pos){
  const c=S.activeCardio; if(!c) return;
  gpsAcc=pos.coords.accuracy;
  if(c.pausedAt||pos.coords.accuracy>40){ updLive(); return; }
  const p=[+pos.coords.latitude.toFixed(6),+pos.coords.longitude.toFixed(6),pos.timestamp||Date.now()];
  const last=c.points[c.points.length-1];
  if(last&&!segNext){
    const d=hav(last,p), dt=Math.max(1,(p[2]-last[2])/1000);
    const vmax=c.type==="ride"?25:c.type==="run"?9:4.5;
    if(!gapNext&&(d<4||d/dt>vmax)){ updLive(); return; }
    if(gapNext){ p.push(1); c.gaps=(c.gaps||0)+1; }
    c.dist+=d;
  }else if(last&&segNext){ p.push(2); }
  gapNext=false; segNext=false;
  c.points.push(p);
  if(c.points.length%5===0) save();
  updLive();
}
document.addEventListener("visibilitychange",()=>{
  const c=S.activeCardio; if(!c) return;
  if(document.visibilityState==="hidden"){ if(!c.pausedAt) gapNext=true; save(); }
  else{ keepAwake(true); if(geoWatch==null&&!c.pausedAt&&view==="today") beginWatch(); }
});
function toggleCardioPause(){
  const c=S.activeCardio; if(!c) return;
  if(c.pausedAt){ c.pausedMs=(c.pausedMs||0)+(Date.now()-c.pausedAt); c.pausedAt=null; segNext=true; gapNext=false; if(geoWatch==null) beginWatch(); }
  else c.pausedAt=Date.now();
  save(); render();
}
function curSpeed(c){
  const P=c.points; if(P.length<2) return null;
  const last=P[P.length-1]; let i=P.length-2;
  while(i>0&&last[2]-P[i][2]<12000&&!P[i+1][3]) i--;
  const dt=(last[2]-P[i][2])/1000; if(dt<3) return null;
  let d=0; for(let k=i+1;k<P.length;k++){ if(P[k][3]===2) continue; d+=hav(P[k-1],P[k]); }
  return d/dt;
}
function updLive(){
  const c=S.activeCardio; if(!c) return;
  const el=id=>document.getElementById(id); if(!el("cd-dist")) return;
  const km=c.dist/1000, ms=cElapsed(c);
  el("cd-dist").textContent=km.toFixed(2);
  el("cd-time").textContent=fmtDur(ms);
  if(c.type==="ride"){
    el("cd-pace").textContent=ms>5000&&km>0.02?(km/(ms/36e5)).toFixed(1):"—";
    const v=curSpeed(c); el("cd-cur").textContent=v!=null?(v*3.6).toFixed(1):"—";
  }else{
    const pace=km>0.02?ms/60000/km:null;
    el("cd-pace").textContent=pace?Math.floor(pace)+":"+String(Math.round(pace%1*60)).padStart(2,"0"):"—";
    el("cd-cur").textContent=c.points.length;
  }
  const g=el("cd-gps");
  if(g){
    const st=c.pausedAt?["","Paused"]:gpsAcc==null?["","Finding GPS…"]:gpsAcc<0?["none","No GPS signal"]:gpsAcc<=20?["ok",`GPS good · ±${Math.round(gpsAcc)} m`]:["weak",`GPS weak · ±${Math.round(gpsAcc)} m`];
    g.className="gps "+st[0]; g.querySelector("span").textContent=st[1];
  }
  const r=el("cd-route"); if(r&&r._n!==c.points.length){ r._n=c.points.length; r.innerHTML=routeSVG(c.points,340,220); }
}
function routeSVG(pts,W,H){
  const bg=`<rect width="${W}" height="${H}" fill="var(--group)"/>`;
  let grid=""; for(let x=0;x<=W;x+=34) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--sep)" stroke-width="0.6"/>`;
  for(let y=0;y<=H;y+=34) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--sep)" stroke-width="0.6"/>`;
  if(!pts||pts.length<2) return `<svg viewBox="0 0 ${W} ${H}">${bg}${grid}<text x="${W/2}" y="${H/2+4}" text-anchor="middle" fill="var(--label-3)" font-size="13" font-weight="700" font-family="-apple-system,system-ui,sans-serif">${pts&&pts.length?"Your route draws as you move":"Waiting for GPS"}</text></svg>`;
  const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length, k=Math.cos(lat0*Math.PI/180);
  const xs=pts.map(p=>p[1]*k), ys=pts.map(p=>-p[0]);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  xs.forEach(v=>{if(v<minX)minX=v;if(v>maxX)maxX=v;}); ys.forEach(v=>{if(v<minY)minY=v;if(v>maxY)maxY=v;});
  const pad=20, s=Math.min((W-2*pad)/Math.max(1e-9,maxX-minX),(H-2*pad)/Math.max(1e-9,maxY-minY));
  const ox=(W-(maxX-minX)*s)/2, oy=(H-(maxY-minY)*s)/2;
  const P=i=>[(ox+(xs[i]-minX)*s).toFixed(1),(oy+(ys[i]-minY)*s).toFixed(1)];
  let solid="",dash="";
  for(let i=0;i<pts.length;i++){
    const [x,y]=P(i), f=pts[i][3];
    if(i===0||f===2){ solid+=`M${x},${y}`; continue; }
    if(f===1){ const [px,py]=P(i-1); dash+=`M${px},${py}L${x},${y}`; solid+=`M${x},${y}`; }
    else solid+=`L${x},${y}`;
  }
  const [sx,sy]=P(0), [ex2,ey2]=P(pts.length-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map">${bg}${grid}
    ${dash?`<path d="${dash}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" fill="none" opacity=".55"/>`:""}
    <path d="${solid}" stroke="var(--accent)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sx}" cy="${sy}" r="6" fill="#30d158" stroke="var(--group)" stroke-width="2.5"/>
    <circle cx="${ex2}" cy="${ey2}" r="6" fill="var(--label)" stroke="var(--group)" stroke-width="2.5"/></svg>`;
}

function simplifyRoute(P){
  const out=[]; let last=null;
  P.forEach((p,i)=>{ if(!last||p[3]||i===P.length-1||hav(last,p)>=8){ out.push(p.length>3?[p[0],p[1],p[2],p[3]]:[p[0],p[1],p[2]]); last=p; } });
  if(out.length<=2000) return out;
  const st=Math.ceil(out.length/2000); return out.filter((p,i)=>i%st===0||p[3]||i===out.length-1);
}

function cardioKcal(c){
  const kg=latestKg(), h=(c.durationSec||0)/3600, km=(c.distM||0)/1000, v=h?km/h:0;

  const met=c.type==="ride"?(!v?6.8:v<16?4:v<19?6.8:v<22?8:v<25?10:12):c.type==="walk"?3.5:6;
  return Math.round((met-1)*kg*h);
}

function prevSetsFor(exId){
  const p=lastSessionFor(exId,S.active?S.active.id:null);
  return p? p.en.sets.filter(s=>s.done) : [];
}
function swapExercise(ei){
  const en=S.active.entries[ei], from=ex(en.exerciseId);
  const logged=en.sets.filter(s=>s.done).length;
  pickExercise(id=>{
    const to=ex(id);
    en.exerciseId=id;
    if(logged){
      en.notes=(en.notes?en.notes+" ":"")+`Swapped from ${from.name} after ${logged} set${logged===1?"":"s"}.`;
    }else{
      // no sets logged yet — re-prime the pre-fill from the new exercise's own history
      const prev=lastSessionFor(id,S.active.id);
      en.sets=en.sets.map((st,i)=>{
        if(st.done) return st;
        const pool=prev?prev.en.sets.filter(x=>x.done&&x.type===st.type):[];
        const p=pool[i]||pool[pool.length-1];
        return {...st,weight:p?(+p.weight||0):"",reps:p?p.reps:st.reps,ghost:true};
      });
    }
    save(); closeSheet(); render();
    toast(logged?`Swapped to ${to.name} — ${logged} logged set${logged===1?"":"s"} kept`:`Swapped to ${to.name}`);
  });
}

      const tag=s.type==="warmup"?'<span class="stag w" onclick="cycleType('+ei+','+si+')">W</span>'
        :s.type==="drop"?'<span class="stag d" onclick="cycleType('+ei+','+si+')">D</span>'
        :'<span class="stag" onclick="cycleType('+ei+','+si+')">'+(en.sets.slice(0,si+1).filter(x=>x.type!=="warmup").length)+'</span>';
      const p=pm[si];
      const c=s.done?cmpSet(s,(S.active.comeback&&s.plan&&s.plan.w!==""&&s.plan.w!=null)?{weight:s.plan.w,reps:s.plan.r}:p):null;
      const isPR=s.done&&s.type!=="warmup"&&(+s.weight||0)>=best.weight&&best.weight>0;
      const prevCell=p?`<span class="prev tap" onclick="usePrev(${ei},${si},${p.weight},${p.reps})">${disp(p.weight,e)}<br>×${p.reps}</span>`:`<span class="prev">—</span>`;
      return `<div class="setrow ${s.done?"done "+(c||""):""} ${isCur&&cur.si===si?"focusrow":""}">
        ${tag}
        ${prevCell}
        <input inputmode="decimal" class="${s.ghost&&!s.done?"ghost":""}" value="${s.weight===""?"":disp(s.weight,e)}" placeholder="—"
          onfocus="this.classList.remove('ghost')" onchange="setField(${ei},${si},'weight',this.value)">
        <input inputmode="numeric" class="${s.ghost&&!s.done?"ghost":""}" value="${s.reps??""}" placeholder="—"
          onfocus="this.classList.remove('ghost')" onchange="setField(${ei},${si},'reps',this.value)">
        <button class="chk ${s.done?"on":""}" onclick="toggleSet(${ei},${si})" aria-label="${s.done?"Undo set":"Log set"}">${isPR?ICON.star:ICON.check}</button>
      </div>`;
    }).join("")}
    <div class="row" style="padding:8px 10px;gap:6px;flex-wrap:wrap">
      <button class="btn sm" onclick="addSet(${ei},'normal')">+ Set</button>
      <button class="btn sm" onclick="addSet(${ei},'warmup')">+ Warm-up</button>
      <button class="btn sm" onclick="addSet(${ei},'drop')">+ Drop</button>
      <button class="btn sm" onclick="buildWarmup(${ei})">Ramp</button>
      <span class="pr" style="margin-left:auto">PR ${best.weight?disp(best.weight,e)+e.unit:"—"}</span>
    </div>
  </div>`;
}
function usePrev(ei,si,w,r){
  const s=S.active.entries[ei].sets[si];
  s.weight=w;s.reps=r;s.ghost=false;save();render();
}
function buildWarmup(ei){
  const en=S.active.entries[ei],e=ex(en.exerciseId);
  const work=Math.max(...en.sets.filter(s=>s.type==="normal").map(s=>+s.weight||0),0);
  if(!work){toast("Enter your working weight first");return;}
  const bar=/Barbell|Squat|Deadlift|Bench Press|Overhead Press|Row|Good Morning|Clean/i.test(e.name+" "+e.equipment)?20:0;
  const ramp=[];
  if(bar&&work>bar*2) ramp.push({w:bar,r:8});
  [[0.4,5],[0.6,3],[0.8,2]].forEach(([pct,reps])=>{
    let w=work*pct;
    w=bar?Math.max(bar,Math.round(w/2.5)*2.5):Math.round(w/2.5)*2.5;
    if(w>0&&w<work&&!ramp.some(x=>x.w===w)) ramp.push({w,r:reps});
  });
  en.sets=en.sets.filter(s=>s.type!=="warmup");
  en.sets=ramp.map(x=>({type:"warmup",weight:x.w,reps:x.r,done:false,ghost:true})).concat(en.sets);
  save();render();toast(`${ramp.length} warm-up sets added`);
}
function setField(ei,si,f,v){
  const en=S.active.entries[ei],e=ex(en.exerciseId),s=en.sets[si];
  s[f]= f==="weight"? toKg(v,e) : (v===""?"":parseInt(v)||0);
  s.ghost=false; save();
}
function toggleSet(ei,si){
  const s=S.active.entries[ei].sets[si];
  s.done=!s.done; s.ghost=false;
  if(s.done){ if(s.weight==="")s.weight=0; if(s.reps==="")s.reps=0; const _en=S.active.entries[ei], _e=ex(_en.exerciseId);
    if(s.type==="drop"){
      const nxt=_en.sets[si+1];
      if(nxt&&nxt.type==="drop"&&!nxt.done) startRest(15,"next drop");
      else startRest(_e.rest,_e.name);
    }
    else if(s.type!=="warmup") startRest(_e.rest,_e.name); }
  save(); render();
  if(s.done) focusScroll();
}
function addSet(ei,type){
  const sets=S.active.entries[ei].sets, last=[...sets].reverse().find(s=>s.type===type)||sets[sets.length-1];
  sets.push({type,weight:last?last.weight:"",reps:last?last.reps:"",done:false,ghost:true}); save(); render();
}
function cycleType(ei,si){
  const s=S.active.entries[ei].sets[si];
  s.type={normal:"warmup",warmup:"drop",drop:"normal"}[s.type]; save(); render();
}

/* --- HISTORY --- */
function daysAgo(d){
  const p=String(d).split("-"), t=todayISO().split("-");
  const a=new Date(+t[0],+t[1]-1,+t[2]), b=new Date(+p[0],+p[1]-1,+p[2]);
  return Math.round((a-b)/86400000);
}
function streakDays(){
  const weeks=new Set(S.workouts.map(w=>weekKey(w.date)));
  let n=0,d=new Date();
  for(;;){ const k=weekKey(isoLocal(d));
    if(weeks.has(k)) n++; else if(n>0||daysAgo(isoLocal(d))>6) break;
    d.setDate(d.getDate()-7); if(n>520)break; }
  return n;
}
function weekKey(iso){const p=iso.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return isoLocal(d);}
let calMonth=null;
function shiftMonth(n){
  const p=calMonth.split("-"); const d=new Date(+p[0],+p[1]-1,1); d.setMonth(d.getMonth()+n);
  calMonth=isoLocal(d).slice(0,7); render();
}
function vHistory(){
  setNav(TITLES.history,"","");
  if(!calMonth) calMonth=todayISO().slice(0,7);
  const vol={},cdays={};
  S.workouts.forEach(w=>{ vol[w.date]=(vol[w.date]||0)+workoutVolume(w); });
  (S.cardio||[]).forEach(c=>{ (cdays[c.date]=cdays[c.date]||[]).push(c); });
  const max=Math.max(1,...Object.values(vol));
  const [Y,M]=calMonth.split("-").map(Number);
  const first=new Date(Y,M-1,1);
  const lead=(first.getDay()+6)%7;
  const dim=new Date(Y,M,0).getDate();
  const label=first.toLocaleDateString("en-NZ",{month:"long",year:"numeric"});
  const cells=[];
  for(let k=0;k<lead;k++) cells.push('<div class="day pad"></div>');
  for(let d=1;d<=dim;d++){
    const iso=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const v=vol[iso]||0, lvl=v?Math.min(4,Math.ceil(v/max*4)):0;
    const w=S.workouts.find(x=>x.date===iso), cd=cdays[iso];
    const tap=w?`onclick="showWorkout('${w.id}')"`:cd?`onclick="showCardio('${cd[0].id}')"`:"";
    cells.push(`<div class="day ${v?"has":""} ${cd?"cdo":""} ${iso===todayISO()?"today":""}" ${v?`data-l="${lvl}"`:""} ${tap}>${d}</div>`);
  }
  const monthCount=Object.keys(vol).filter(k=>k.startsWith(calMonth)).length;
  const monthCardio=(S.cardio||[]).filter(c=>c.date.startsWith(calMonth)).length;
  const items=S.workouts.map(w=>({k:"w",date:w.date,ts:w.ts||0,o:w})).concat((S.cardio||[]).map(c=>({k:"c",date:c.date,ts:c.ts||0,o:c})))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const byMonth={};
  items.forEach(it=>{ (byMonth[it.date.slice(0,7)]=byMonth[it.date.slice(0,7)]||[]).push(it); });
  const dshort=d=>new Date(d+"T00:00:00").toLocaleDateString("en-NZ",{day:"numeric",month:"short"});
  return `<div class="largetitle">History</div>
  <div class="largesub">${S.workouts.length} workouts${(S.cardio||[]).length?` · ${(S.cardio||[]).length} cardio`:""}</div>
  <div class="card">
    <div class="calhead">
      <button class="calnav" onclick="shiftMonth(-1)" aria-label="Previous month">${ICON.left}</button>
      <div style="text-align:center"><div class="m">${label}</div>
        <div class="mute" style="font-size:var(--t-cap)">${monthCount} session${monthCount===1?"":"s"}${monthCardio?` · ${monthCardio} cardio`:""}</div></div>
      <button class="calnav" onclick="shiftMonth(1)" aria-label="Next month">${ICON.right}</button>
    </div>
    <div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells.join("")}</div>
    <div class="row" style="margin-top:var(--s4);gap:var(--s2);flex-wrap:wrap">
      <span class="pill">${streakDays()} week streak</span>
      ${(S.cardio||[]).length?`<span class="pill" style="box-shadow:inset 0 0 0 1.5px #64d2ff">Ring = cardio</span>`:""}
      <button class="btn sm" style="margin-left:auto" onclick="calMonth=todayISO().slice(0,7);render()">Today</button></div>
  </div>
  ${items.length?Object.keys(byMonth).map(mk=>{
    const ml=new Date(+mk.split("-")[0],+mk.split("-")[1]-1,1).toLocaleDateString("en-NZ",{month:"long",year:"numeric"});
    return `<div class="eyebrow">${ml}</div><div class="group">
      ${byMonth[mk].map(it=>{
        if(it.k==="c"){ const c=it.o, T=CT[c.type]||CT.other;
          return `<div class="row-i" onclick="showCardio('${c.id}')">
          <span class="tile" style="background:${T.c};color:#000">${ICON[T.icon]}</span>
          <span class="t"><div>${T.n}${c.commute?' <span class="cardiotag">Commute</span>':""}</div>
            <div class="sub">${c.distM?(c.distM/1000).toFixed(2)+" km · ":""}${Math.round((c.durationSec||0)/60)} min${c.gps?" · GPS":""}</div></span>
          <span class="v" style="font-size:var(--t-sub)">${dshort(c.date)}</span>

let progEx=null, progTab="overview", progWin=28, liftWin=365, bodyWin=365;
function setLiftWin(d){liftWin=d;render();}
function setBodyWin(d){bodyWin=d;render();}
function muscleLoad(days){
  const cut=new Date(); cut.setDate(cut.getDate()-days);
  const iso=isoLocal(cut);
  const sets={}, vol={};
  S.workouts.filter(w=>w.date>=iso).forEach(w=>w.entries.forEach(en=>{
    const e=ex(en.exerciseId);
    const working=en.sets.filter(s=>s.done&&s.type!=="warmup");
    if(!working.length) return;
    const v=working.reduce((n,s)=>n+(+s.weight||0)*(+s.reps||0),0);
    (e.muscles||[]).forEach((m,i)=>{
      const wgt=i===0?1:0.5;
      sets[m]=(sets[m]||0)+working.length*wgt;
      vol[m]=(vol[m]||0)+v*wgt;
    });
  }));
  return Object.keys(sets).map(m=>({m,sets:Math.round(sets[m]*10)/10,vol:Math.round(vol[m])}))
    .sort((a,b)=>b.sets-a.sets);
}
function weekBounds(offset){
  const d=new Date(todayISO()); d.setDate(d.getDate()-((d.getDay()+6)%7)-7*offset);
  const start=isoLocal(d);
  const e=new Date(d); e.setDate(e.getDate()+6);
  return {start,end:isoLocal(e)};
}
function weekStats(offset){
  const {start,end}=weekBounds(offset);
  const ws=S.workouts.filter(w=>w.date>=start&&w.date<=end);
  let sets=0,vol=0; const mus={};
  ws.forEach(w=>w.entries.forEach(en=>{
    const e=ex(en.exerciseId);
    const work=en.sets.filter(s2=>s2.done&&s2.type!=="warmup");
    sets+=work.length;
    vol+=work.reduce((n,s2)=>n+(+s2.weight||0)*(+s2.reps||0),0);
    (e.muscles||[]).forEach((m,i)=>{ mus[m]=(mus[m]||0)+work.length*(i===0?1:0.5); });
  }));
  return {start,end,sessions:ws.length,sets,vol:Math.round(vol),mus,workouts:ws};
}

let repMonth=null;
function shiftRepMonth(n){

function monthStats(key){

const RANGES=[["1M",30],["6M",182],["12M",365],["All",0]];
function inRange(iso,days){ if(!days) return true; return (new Date(todayISO())-new Date(iso))/86400000<=days; }
function niceStep(range,target){
  if(!(range>0)) return 1;
  const raw=range/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const mult = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return mult*mag;
}
function chart(pts,unit,decimals,COL){
  COL=COL||"var(--accent)";
  if(pts.length<2) return `<div class="mute" style="font-size:var(--t-footnote);padding:14px 0">Two data points needed before a line means anything.</div>`;
  const W=320,H=140,pl=34,pr=6,pt=10,pb=18;
  const xs=pts.map(p=>new Date(p.d).getTime());
  const vs=pts.map(p=>p.v);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), span=(x1-x0)||1;
  const mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const pad=((mx-mn)||Math.max(1,Math.abs(mx)*0.04))*0.18;
  const step=niceStep((mx+pad)-(mn-pad),4);
  const lo=Math.floor((mn-pad)/step)*step, hi=Math.ceil((mx+pad)/step)*step;
  const X=t=>pl+((t-x0)/span)*(W-pl-pr);
  const Y=v=>H-pb-((v-lo)/((hi-lo)||1))*(H-pt-pb);
  const fmt=n=>{const r=Math.round(n*100)/100; return decimals||step<1? r.toFixed(1) : String(Math.round(r));};
  const lines=[];
  for(let v=lo; v<=hi+1e-9; v+=step){
    const y=Y(v).toFixed(1);
    lines.push(`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--sep)" stroke-width="0.6" opacity="0.55"/>`);
    lines.push(`<text x="${pl-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--label-2)" font-family="ui-monospace,-apple-system,monospace">${fmt(v)}</text>`);
  }
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area=`M${X(x0).toFixed(1)},${H-pb} `+pts.map((p,i)=>`L${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ")+` L${X(x1).toFixed(1)},${H-pb} Z`;
  const marks=pts.length>40?[0,pts.length-1]:pts.map((_,i)=>i);
  const dfmt=t=>{const d=new Date(t);return d.toLocaleDateString("en-NZ",{month:"short"})+" '"+String(d.getFullYear()).slice(2);};
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Trend chart">
    ${lines.join("")}
    <path d="${area}" fill="${COL}" opacity="0.14"/>
    <path d="${d}" fill="none" stroke="${COL}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks.map(i=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(pts[i].v).toFixed(1)}" r="2.2" fill="var(--group)" stroke="${COL}" stroke-width="1.6"/>`).join("")}
    <text x="${pl}" y="${H-5}" font-size="8.5" fill="var(--label-2)" font-family="ui-monospace,-apple-system,monospace">${dfmt(x0)}</text>
    <text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="8.5" fill="var(--label-2)" font-family="ui-monospace,-apple-system,monospace">${dfmt(x1)}</text>
    <text x="${pl-5}" y="${pt+2}" text-anchor="end" font-size="8" fill="var(--label-3)" font-family="ui-monospace,-apple-system,monospace">${unit}</text>
  </svg>
  <div class="mono mute" style="font-size:var(--t-caption2);text-align:right">${unit}</div>`;
}
function rangeTabs(current,fn){
  return `<div class="tabs">${RANGES.map(([l,d])=>`<button class="${current===d?"on":""}" onclick="${fn}(${d})">${l}</button>`).join("")}</div>`;
}

function readBackupFile(input){

  setBStatus(`Reading ${f.name} (${Math.round(f.size/1024)} KB)\u2026`);
  const r=new FileReader();
  r.onload=()=>loadBackupText(String(r.result||""),f.name);

function loadBackupText(txt,label){
  const el=document.getElementById("bactions"); if(el) el.innerHTML="";

  if(!txt||!txt.trim()){ setBStatus("That file was empty."); return; }
  let pj;
  try{ pj=JSON.parse(txt.replace(/^\uFEFF/,"").trim()); }
  catch(e){ setBStatus(`${esc(label)} isn't valid JSON \u2014 ${esc(e.message)}`); return; }
  const d=(pj&&pj.format==="ironlog-backup")?pj.data:pj;
  if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.exercises)){

  _restoreData=d;

  setBStatus(`<span style="color:var(--green)">${esc(label)} loaded.</span><br>
    ${d.workouts.length} workouts${dates.length?` (${dates[0]} to ${dates[dates.length-1]})`:""},
    ${(d.routines||[]).length} routines, ${d.exercises.length} exercises, ${(d.body||[]).length} weigh-ins.`);

  const raw=document.getElementById("mimp").value.trim();
  if(!raw){toast("Choose a file or paste the CSV first");return;}
  const rows=parseCSV(raw), head=rows.shift().map(h=>h.trim().toLowerCase().replace(/^"|"$/g,""));
  const find=(...pats)=>{
    for(const p of pats){ const i=head.findIndex(h=>h===p); if(i>=0) return i; }
    for(const p of pats){ const i=head.findIndex(h=>h.includes(p)); if(i>=0) return i; }
    return -1;
  };
  const cD=find("date","start_time","time","timestamp");
  let cW=find("weight_kg","bodyweight_kg","weight","bodyweight","mass");
  const lbCol=cW>=0 && /lb|pound/.test(head[cW]);
  if(cD<0||cW<0){toast("Couldn't find date and weight columns");return;}
  const seen={}; let n=0,skipped=0;
  rows.forEach(r=>{
    const date=hevyDate(r[cD]); const v=parseFloat(r[cW]);
    if(!date||isNaN(v)||v<=0){skipped++;return;}
    seen[date]=lbCol?LB2KG(v):v; n++;
  });
  const dates=Object.keys(seen);
  if(!dates.length){toast("No usable rows found");return;}
  S.body=S.body.filter(b=>!seen[b.date]);
  dates.forEach(d=>S.body.push({date:d,kg:Math.round(seen[d]*10)/10}));
  S.body.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeSheet();go("settings");
  toast(`${dates.length} weigh-ins imported${skipped?` \u00b7 ${skipped} rows skipped`:""}`);
}
function readHevyFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{document.getElementById("imp").value=r.result;toast("File loaded \u2014 tap Import");};
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(f);
}
function parseCSV(t){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);cur="";rows.push(row);row=[];}
    else if(c!=="\r")cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c!==""));
}
function hevyDate(str){
  if(!str) return null;
  const iso=(str.match(/\d{4}-\d{2}-\d{2}/)||[])[0];
  if(iso) return iso;
  const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m=str.match(/([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})/);
  if(m && M[m[1].toLowerCase()]!=null){
    return isoLocal(new Date(+m[3],M[m[1].toLowerCase()],+m[2]));
  }
  const d=new Date(str);
  return isNaN(d)?null:isoLocal(d);
}
function cleanName(n){
  return n.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+-\s+.*$/,"").replace(/\s+/g," ").trim();
}
function guessMuscle(n){
  const t=n.toLowerCase();
  const map=[[/lateral raise|side delt/,"Side Delts"],[/rear delt|reverse fly|face pull/,"Rear Delts"],
    [/shoulder press|overhead press|arnold|front raise|shrug press/,"Front Delts"],[/shrug/,"Traps"],
    [/curl/,"Biceps"],[/tricep|pushdown|skull|kickback|dip/,"Triceps"],
    [/chest|bench|fly|pec|push up/,"Chest"],[/row|pulldown|pull up|chin up|lat /,"Back"],
    [/squat|leg press|lunge|leg extension|hack/,"Quads"],[/deadlift|leg curl|hamstring|good morning/,"Hamstrings"],
    [/hip thrust|glute/,"Glutes"],[/calf/,"Calves"],[/ab |crunch|plank|core|leg raise/,"Core"],
    [/forearm|wrist|grip/,"Forearms"]];
  for(const [re,m] of map) if(re.test(t)) return m;
  return "Other";
}
function matchExercise(rawName){
  const clean=cleanName(rawName);
  let e=S.exercises.find(x=>x.name.toLowerCase()===rawName.toLowerCase())
     || S.exercises.find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(e) return e;
  const eqm=rawName.match(/\(([^)]*)\)/);
  const primary=guessMuscle(clean);
  e={id:uid(),name:clean||rawName,muscles:[primary],primary,
     equipment:eqm?eqm[1]:"Imported",unit:"kg",rest:defaultRest(clean,primary),
     inc:/Squat|Deadlift|Leg Press|Hip Thrust|Lunge|Hack|Calf/i.test(clean)?5:2.5,custom:true};
  S.exercises.push(e);
  return e;
}
function runImport(){
  const raw=document.getElementById("imp").value.trim();
  if(!raw){toast("Choose a file or paste the CSV first");return;}
  const rows=parseCSV(raw), head=rows.shift().map(h=>h.trim().toLowerCase().replace(/^"|"$/g,""));
  const col=(...names)=>{for(const n of names){const i=head.indexOf(n);if(i>=0)return i;}return -1;};
  const cT=col("title","workout_name"),cD=col("start_time","date"),cEnd=col("end_time"),
        cE=col("exercise_title","exercise_name","exercise"),cType=col("set_type"),
        cW=col("weight_kg","weight"),cR=col("reps"),cSS=col("superset_id"),cN=col("exercise_notes");
  if(cE<0||cR<0){toast("Couldn't find exercise and reps columns");return;}
  const byWorkout={};let n=0,skipped=0,newEx=S.exercises.length;
  rows.forEach(r=>{
    const date=hevyDate(cD>=0?r[cD]:"");
    if(!date){skipped++;return;}
    const name=(cT>=0?r[cT]:"")||"Imported workout";
    const k=date+"|"+name+"|"+(cD>=0?r[cD]:"");
    if(!byWorkout[k]){
      let dur=0;
      if(cEnd>=0&&r[cEnd]){const a=new Date(r[cD]),b=new Date(r[cEnd]);
        if(!isNaN(a)&&!isNaN(b)) dur=Math.max(0,Math.round((b-a)/1000));}
      byWorkout[k]={id:uid(),date,ts:new Date(date+"T00:00:00").getTime(),name,entries:[],durationSec:dur,imported:true};
    }
    const exName=(r[cE]||"").trim();if(!exName)return;
    const e=matchExercise(exName);
    let en=byWorkout[k].entries.find(x=>x.exerciseId===e.id);
    if(!en){en={exerciseId:e.id,superset:(cSS>=0&&r[cSS]?String(r[cSS]).trim():""),
      sets:[],notes:(cN>=0?(r[cN]||"").trim():"")};byWorkout[k].entries.push(en);}
    const t=(cType>=0?(r[cType]||"").toLowerCase():"normal");
    en.sets.push({type:/warm/.test(t)?"warmup":/drop/.test(t)?"drop":"normal",
      weight:parseFloat(cW>=0?r[cW]:0)||0,reps:parseInt(r[cR])||0,done:true});
    n++;
  });
  const added=Object.values(byWorkout).filter(w=>w.entries.length);
  if(!added.length){toast("Nothing imported \u2014 check the file");return;}
  S.workouts=S.workouts.concat(added);
  newEx=S.exercises.length-newEx;
  save();closeSheet();go("history");
  toast(`${added.length} workouts, ${n} sets, ${newEx} new exercises`);
}

function loadProgram(){
  if(!confirm("Replace your routines with the four U/L days and set rest, increments and rep ranges on every exercise?")) return;
  let made=0;
  const keep=PROGRAM.map(d=>d.day);
  S.routines=S.routines.filter(r=>keep.indexOf(r.name)>=0);
  PROGRAM.forEach(d=>{
    const items=d.items.map(([name,sets,top,low,rest,inc,drops])=>{
      const e=matchExercise(name);
      e.rest=rest; e.inc=inc; e.repLow=low;
      const list=Array.from({length:sets},()=>({type:"normal",reps:top}));
      for(let i=0;i<(drops||0);i++) list.push({type:"drop",reps:top});
      return {exerciseId:e.id,superset:"",sets:list};
    });
    S.routines=S.routines.filter(r=>r.name!==d.day);
    S.routines.push({id:uid(),name:d.day,items,cooldown:(COOLDOWNS[d.day]||[]).map(([name,secs,note])=>({name,secs,note}))});
    made++;
  });

}
