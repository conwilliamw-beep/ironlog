<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Ironlog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#101216">
<style>
:root{
  --ink:#14161a;
  --ink-2:#1c2026;
  --ink-3:#252a32;
  --line:#333a45;
  --chalk:#e8e6e1;
  --mute:#8e97a5;
  --brass:#d9a441;
  --brass-dim:#8a6a2c;
  --good:#5fb07a;
  --warn:#c96a5a;
  --r:10px;
  --f-disp:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;
  width:auto;height:100dvh;
  box-sizing:border-box;
  display:flex;flex-direction:column;
  background:#101216;
}
body{
  background:var(--ink);color:var(--chalk);
  font-family:var(--f-disp);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:24px}
h2{font-size:17px}
.wrap{
  background:var(--ink);
  flex:1 1 auto;min-height:0;width:100%;max-width:560px;margin:0 auto;
  padding:14px 14px 24px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--f-mono)}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-weight:600;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brass);color:#1a1408;border-color:var(--brass)}
.btn.danger{color:var(--warn);border-color:#4a3230}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.wide{width:100%;text-align:center;padding:13px}
input,select,textarea{
  font:inherit;background:var(--ink);color:var(--chalk);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;
}
input:focus,select,textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
label.fl{display:block;margin:8px 0 4px;font-size:12px;color:var(--mute)}
/* nav */
nav{
  flex:0 0 auto;z-index:40;
  background:#101216;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:10px;
}
nav button{padding:7px 2px 6px;font-size:10px;color:var(--mute);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
nav button .ic{display:block;font-size:16px;margin-bottom:1px;line-height:1.1;font-family:var(--f-disp)}
nav button.on{color:var(--brass)}
/* set rows */
.exblock{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;background:var(--ink-2)}
.exhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--ink-3)}
.exhead .nm{font-weight:700;font-size:15px}
.ss{font-family:var(--f-mono);font-size:10px;color:var(--brass);border:1px solid var(--brass-dim);border-radius:4px;padding:1px 5px;margin-left:6px}
.setrow{display:grid;grid-template-columns:32px 56px 1fr 1fr 38px;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid #22262e}
.setrow.done{background:#1a2620}
.stag{font-family:var(--f-mono);font-size:12px;text-align:center;border-radius:5px;padding:5px 0;background:var(--ink);border:1px solid var(--line)}
.stag.w{color:var(--brass);border-color:var(--brass-dim)}
.stag.d{color:#9a86d8;border-color:#4a3f6b}
.prev{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);text-align:center;line-height:1.1;padding:4px 0;border-radius:5px}
.prev.tap{border:1px dashed var(--line)}
.exnote{font-size:11.5px;color:var(--brass);padding:6px 12px;border-top:1px solid #22262e;background:#1b1811}
.mbar{height:7px;background:var(--ink-3);border-radius:99px;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:var(--brass);border-radius:99px}
.setrow input{padding:8px 6px;text-align:center;font-family:var(--f-mono);font-size:16px}
.setrow input.ghost{color:var(--mute)}
.chk{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;font-size:15px}
.chk.on{background:var(--good);border-color:var(--good);color:#0d1a12}
.colhead{display:grid;grid-template-columns:32px 56px 1fr 1fr 38px;gap:6px;padding:4px 10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.colhead span{text-align:center}
/* rest bar */
#rest{flex:0 0 auto;z-index:39;display:none}
#rest .inner{max-width:560px;margin:0 auto;background:var(--brass);color:#1a1408;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700}
#rest .t{font-family:var(--f-mono);font-size:19px}
/* heatmap */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center;padding-bottom:2px}
.cal .day{aspect-ratio:1;border-radius:7px;background:#1a1e25;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.cal .day.pad{background:transparent}
.cal .day.today{border-color:var(--mute)}
.cal .day.has{color:#1a1408;font-weight:700}
.cal .day.has[data-l="1"]{background:#7a5f28}
.cal .day.has[data-l="2"]{background:#a97f30}
.cal .day.has[data-l="3"]{background:#c99a38}
.cal .day.has[data-l="4"]{background:var(--brass)}
.cal .day .dot{width:4px;height:4px;border-radius:50%;background:#1a1408;opacity:.55}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .m{font-weight:700;font-size:15px}
.calnav{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;font-size:14px}
/* misc */
.pill{font-family:var(--f-mono);font-size:11px;background:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mute)}
.pr{color:var(--brass);font-family:var(--f-mono);font-size:11px}
.big{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:-.03em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--f-mono);font-size:21px;font-weight:700}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid #22262e}
.list-item:last-child{border-bottom:none}
.sheet{position:fixed;inset:0;background:rgba(8,9,11,.72);z-index:60;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .panel{background:var(--ink-2);width:100%;max-width:560px;margin:0 auto;border-radius:14px 14px 0 0;border-top:1px solid var(--line);max-height:88vh;overflow-y:auto;padding:14px 14px 20px}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty .big-e{font-size:34px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.tabs button.on{color:var(--brass);border-color:var(--brass-dim);background:#221c10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--chalk);color:var(--ink);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<div id="rest"><div class="inner"><span id="restlabel">Rest</span><span class="t" id="resttime">0:00</span><button class="btn sm" onclick="skipRest()">Skip</button></div></div>

<script>
/* ---------- seed exercise library: name|primary|secondary|equipment ---------- */

/* ---------- state ---------- */
const KEY="ironlog:v1";
let S={exercises:[],routines:[],workouts:[],body:[],settings:{restSec:120,unit:"kg"},active:null};
let view="today", loaded=false;

const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
const KG=w=>w, LB2KG=w=>w*0.45359237, KG2LB=w=>w/0.45359237;

/* ---- IndexedDB: local, offline, survives app updates ---- */
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open("ironlog",1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess=()=>{_db=r.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("kv","readonly").objectStore("kv").get(k);
    t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);
  });
}
async function idbSet(k,v){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("kv","readwrite").objectStore("kv").put(v,k);
    t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error);
  });
}

function defaultRest(name,primary){
  if(/Deadlift|Back Squat|Front Squat|Zercher|Power Clean|Hang Clean|Clean and Press|Rack Pull|Box Squat|Pause Squat|Snatch Grip|Deficit/i.test(name)) return 240;
  if(/Bench Press|Overhead Press|Push Press|Squat|Row|Pull Up|Chin Up|Dip|Hip Thrust|Leg Press|Hack|Romanian|Good Morning|Lunge|Split Squat|Pulldown/i.test(name)) return 180;
  if(/Curl|Raise|Fly|Pushdown|Extension|Kickback|Shrug|Face Pull|Crunch|Plank|Calf|Pec Deck|Abduction|Adduction|Rotation|Crossover/i.test(name)) return 75;
  if(/Core|Calves|Forearms/i.test(primary)) return 60;
  return 120;
}
function seed(){
  S.exercises=SEED.map(([name,p,sec,eq])=>({
    id:uid(),name,muscles:[p,...(sec?sec.split(","):[])].filter(Boolean),
    primary:p,equipment:eq||"Other",unit:"kg",rest:defaultRest(name,p),inc:/Squat|Deadlift|Leg Press|Hip Thrust|Lunge|Hack|Good Morning|Calf/i.test(name)?5:2.5,custom:false
  }));
}
async function load(){
  try{
    const v=await idbGet(KEY);
    if(v) S=Object.assign(S,JSON.parse(v));
  }catch(e){ console.warn("load failed",e); }
  if(!S.exercises||!S.exercises.length) seed();
  if(!S.settings) S.settings={restSec:120,unit:"kg"};
  S.exercises.forEach(e=>{ if(e.rest==null) e.rest=defaultRest(e.name,e.primary||""); });
  loaded=true;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await idbSet(KEY,JSON.stringify(S)); }
    catch(e){ toast("Couldn't save to this device"); }
  },250);
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1900);}
const ex=id=>S.exercises.find(e=>e.id===id)||{name:"Unknown",unit:"kg",inc:2.5,muscles:[],primary:""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* display helpers: kg canonical, per-exercise unit for display */
function disp(kg,e){ if(kg===""||kg==null) return ""; const v=e.unit==="lb"?KG2LB(kg):kg; return Math.round(v*100)/100; }
function toKg(v,e){ if(v==="")return ""; const n=parseFloat(v); if(isNaN(n))return ""; return e.unit==="lb"?LB2KG(n):n; }
const e1rm=(kg,reps)=> reps>0? kg*(1+reps/30) : 0;

/* ---------- history lookups ---------- */
function lastSessionFor(exId,beforeId){
  const ws=S.workouts.filter(w=>w.id!==beforeId).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  for(const w of ws){ const en=w.entries.find(x=>x.exerciseId===exId && x.sets.some(s=>s.done)); if(en) return {w,en}; }
  return null;
}
function bestFor(exId){
  let bw=0,b1=0,bv=0;
  S.workouts.forEach(w=>w.entries.filter(e=>e.exerciseId===exId).forEach(en=>{
    let v=0;
    en.sets.filter(s=>s.done&&s.type!=="warmup").forEach(s=>{
      const kg=+s.weight||0,r=+s.reps||0;
      if(kg>bw)bw=kg; const o=e1rm(kg,r); if(o>b1)b1=o; v+=kg*r;
    });
    if(v>bv)bv=v;
  }));
  return {weight:bw,e1rm:b1,volume:bv};
}
function exSessions(exId){
  return S.workouts.filter(w=>w.entries.some(e=>e.exerciseId===exId&&e.sets.some(s=>s.done)))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts)
    .map(w=>{
      const en=w.entries.find(e=>e.exerciseId===exId);
      const work=en.sets.filter(s=>s.done&&s.type!=="warmup");
      const top=work.reduce((m,s)=>((+s.weight||0)>(+m.weight||0)?s:m),work[0]||{weight:0,reps:0});
      return {id:w.id,date:w.date,name:w.name,sets:work,
        topW:+top.weight||0,topR:+top.reps||0,
        vol:work.reduce((n,s)=>n+(+s.weight||0)*(+s.reps||0),0)};
    });
}
const STALL_WINDOW=90;
function stallInfo(exId){
  const h=exSessions(exId).filter(x=>daysAgo(x.date)<=STALL_WINDOW);
  if(h.length<3) return null;
  const bw=h.every(x=>x.topW===0);
  const score=x=>bw? x.topR : Math.max.apply(null,x.sets.map(s=>e1rm(+s.weight||0,+s.reps||0)).concat([0]));
  let best=-1,idx=0;
  h.forEach((x,i)=>{const v=score(x); if(v>best+1e-9){best=v;idx=i;}});
  const since=h.length-1-idx;
  return {since,best,bw,last:h[h.length-1],sessions:h.length,
    stalled: since>=4,
    bestLabel:(bw? best+" reps" : Math.round(best)+" kg est. 1RM")+" (90d)"};
}
function nextUp(){
  if(!S.routines.length) return null;
  const done=S.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const lastNamed=done.find(w=>S.routines.some(r=>r.name===w.name));
  if(!lastNamed) return S.routines[0];
  const i=S.routines.findIndex(r=>r.name===lastNamed.name);
  return S.routines[(i+1)%S.routines.length];
}
function workoutVolume(w){
  let v=0; w.entries.forEach(en=>en.sets.forEach(s=>{ if(s.done&&s.type!=="warmup") v+=(+s.weight||0)*(+s.reps||0); })); return v;
}
function workoutSets(w){ let n=0; w.entries.forEach(en=>n+=en.sets.filter(s=>s.done).length); return n; }

/* ---------- start a workout ---------- */
function startWorkout(routineId){
  const r=routineId?S.routines.find(x=>x.id===routineId):null;
  const entries=(r?r.items:[]).map(it=>{
    const e=ex(it.exerciseId);
    const prev=lastSessionFor(it.exerciseId,null);
    const targets=it.sets.filter(s=>s.type==="normal");
    const topRep=targets.length?Math.max.apply(null,targets.map(t=>+t.reps||0)):0;
    const lowRep=(e.repLow!=null&&e.repLow>0)?e.repLow:Math.max(1,topRep-4);
    let hitAll=false, prevWork=[];
    if(prev){
      prevWork=prev.en.sets.filter(s=>s.done&&s.type==="normal");
      hitAll = prevWork.length>=targets.length && targets.length>0 &&
        targets.every((t,i)=>prevWork[i] && (+prevWork[i].reps||0) >= (+t.reps||0));
    }
    const sets=it.sets.map((t,i)=>{
      let w="",reps=t.reps??"";
      if(prev){
        const pool=prev.en.sets.filter(s=>s.done&&s.type===t.type);
        const p=pool[i]||pool[pool.length-1];
        if(p){
          const pw=+p.weight||0, pr=+p.reps||0;
          if(t.type!=="normal"){ w=pw; reps=pr; }
          else if(hitAll){ w=pw+(e.inc||2.5); reps=lowRep; }
          else { w=pw; reps=Math.min(pr+1, +t.reps||pr+1); }
        }
      }
      return {type:t.type,weight:w===""?"":w,reps,done:false,ghost:true};
    });
    return {exerciseId:it.exerciseId,superset:it.superset||"",sets,notes:""};
  });
  S.active={id:uid(),date:todayISO(),ts:Date.now(),name:r?r.name:"Quick workout",routineId:routineId||null,entries,notes:"",start:Date.now()};
  save(); go("today");
  if(entries.some(e=>e.sets.some(s=>s.weight!=="")))
    toast("Pre-filled \u2014 reps climb, then weight jumps");
}
function finishWorkout(){
  const a=S.active; if(!a) return;
  a.entries.forEach(en=>en.sets=en.sets.filter(s=>s.done));
  a.entries=a.entries.filter(en=>en.sets.length);
  if(!a.entries.length){ if(!confirm("No sets logged. Discard this workout?")) return; S.active=null; save(); return render(); }
  a.durationSec=Math.round((Date.now()-a.start)/1000);
  const prs=[];
  a.entries.forEach(en=>{
    const before=bestFor(en.exerciseId);
    en.sets.filter(s=>s.type!=="warmup").forEach(s=>{
      if((+s.weight||0)>before.weight && +s.reps>0) prs.push(ex(en.exerciseId).name);
    });
  });
  S.workouts.push(a); S.active=null; save();
  toast(prs.length?`Workout saved · ${[...new Set(prs)].length} PR`:"Workout saved");
  go("history");
}

/* ---------- rest timer ---------- */
let restEnd=0,restInt=null;
function startRest(sec,label){
  sec=(sec==null?S.settings.restSec:sec)||0; if(!sec) return;
  document.getElementById("restlabel").textContent=label?("Rest · "+label):"Rest";
  restEnd=Date.now()+sec*1000;
  document.getElementById("rest").style.display="block";
  clearInterval(restInt);
  restInt=setInterval(()=>{
    const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
    document.getElementById("resttime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(left<=0){ skipRest(); if(navigator.vibrate)navigator.vibrate([120,60,120]); toast("Rest done"); }
  },250);
}
function skipRest(){clearInterval(restInt);document.getElementById("rest").style.display="none";}

/* ---------- views ---------- */

function render(){

}

function prevSetsFor(exId){
  const p=lastSessionFor(exId,S.active?S.active.id:null);

function exBlock(en,ei){
  const e=ex(en.exerciseId), best=bestFor(en.exerciseId);
  const prevSets=prevSetsFor(en.exerciseId);
  const byType={};
  prevSets.forEach(s=>{ (byType[s.type]=byType[s.type]||[]).push(s); });
  const counters={};
  return `<div class="exblock">

        :'<span class="stag" onclick="cycleType('+ei+','+si+')">'+(en.sets.slice(0,si+1).filter(x=>x.type!=="warmup").length)+'</span>';
      counters[s.type]=(counters[s.type]||0);
      const pool=byType[s.type]||[];
      const p=pool[counters[s.type]]||null;
      counters[s.type]++;
      const isPR=s.done&&s.type!=="warmup"&&(+s.weight||0)>=best.weight&&best.weight>0;
      const prevCell=p?`<span class="prev tap" onclick="usePrev(${ei},${si},${p.weight},${p.reps})">${disp(p.weight,e)}<br>×${p.reps}</span>`
                      :`<span class="prev">—</span>`;
      return `<div class="setrow ${s.done?"done":""}">
        ${tag}
        ${prevCell}
        <input inputmode="decimal" class="${s.ghost&&!s.done?"ghost":""}" value="${s.weight===""?"":disp(s.weight,e)}" placeholder="—"
          onfocus="this.classList.remove('ghost')" onchange="setField(${ei},${si},'weight',this.value)">
        <input inputmode="numeric" class="${s.ghost&&!s.done?"ghost":""}" value="${s.reps??""}" placeholder="—"
          onfocus="this.classList.remove('ghost')" onchange="setField(${ei},${si},'reps',this.value)">
        <button class="chk ${s.done?"on":""}" onclick="toggleSet(${ei},${si})">${isPR?"★":"✓"}</button>
      </div>`;
    }).join("")}
    <div class="row" style="padding:8px 10px;gap:6px;flex-wrap:wrap">
      <button class="btn sm" onclick="addSet(${ei},'normal')">+ Set</button>

      <button class="btn sm" onclick="addSet(${ei},'drop')">+ Drop</button>
      <button class="btn sm" onclick="buildWarmup(${ei})">Ramp</button>
      <span class="pr" style="margin-left:auto">PR ${best.weight?disp(best.weight,e)+e.unit:"—"}</span>
    </div>
  </div>`;
}
function usePrev(ei,si,w,r){
  const s=S.active.entries[ei].sets[si];
  s.weight=w;s.reps=r;s.ghost=false;save();render();
}
function buildWarmup(ei){
  const en=S.active.entries[ei],e=ex(en.exerciseId);
  const work=Math.max(...en.sets.filter(s=>s.type==="normal").map(s=>+s.weight||0),0);
  if(!work){toast("Enter your working weight first");return;}
  const bar=/Barbell|Squat|Deadlift|Bench Press|Overhead Press|Row|Good Morning|Clean/i.test(e.name+" "+e.equipment)?20:0;
  const ramp=[];
  if(bar&&work>bar*2) ramp.push({w:bar,r:8});
  [[0.4,5],[0.6,3],[0.8,2]].forEach(([pct,reps])=>{
    let w=work*pct;
    w=bar?Math.max(bar,Math.round(w/2.5)*2.5):Math.round(w/2.5)*2.5;
    if(w>0&&w<work&&!ramp.some(x=>x.w===w)) ramp.push({w,r:reps});
  });
  en.sets=en.sets.filter(s=>s.type!=="warmup");
  en.sets=ramp.map(x=>({type:"warmup",weight:x.w,reps:x.r,done:false,ghost:true})).concat(en.sets);
  save();render();toast(`${ramp.length} warm-up sets added`);
}
function setField(ei,si,f,v){

function toggleSet(ei,si){

    if(s.type==="drop") startRest(15,"drop set");
    else if(s.type!=="warmup") startRest(_e.rest,_e.name); }

}
function addSet(ei,type){
  const sets=S.active.entries[ei].sets, last=[...sets].reverse().find(s=>s.type===type)||sets[sets.length-1];

function cycleType(ei,si){

}

/* --- HISTORY --- */
function daysAgo(d){return Math.floor((new Date(todayISO())-new Date(d))/86400000);}
function streakDays(){
  const weeks=new Set(S.workouts.map(w=>weekKey(w.date)));
  let n=0,d=new Date();
  for(;;){ const k=weekKey(d.toISOString().slice(0,10));
    if(weeks.has(k)) n++; else if(n>0||daysAgo(d.toISOString().slice(0,10))>6) break;
    d.setDate(d.getDate()-7); if(n>520)break; }

function muscleLoad(days){

  const sets={}, vol={};
  S.workouts.filter(w=>w.date>=iso).forEach(w=>w.entries.forEach(en=>{

const RANGES=[["1M",30],["6M",182],["12M",365],["All",0]];
function inRange(iso,days){ if(!days) return true; return (new Date(todayISO())-new Date(iso))/86400000<=days; }
function niceStep(range,target){
  if(!(range>0)) return 1;
  const raw=range/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const mult = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return mult*mag;
}
function chart(pts,unit,decimals){
  if(pts.length<2) return `<div class="mute" style="font-size:13px;padding:14px 0">Two data points needed before a line means anything.</div>`;
  const W=320,H=140,pl=34,pr=6,pt=10,pb=18;
  const xs=pts.map(p=>new Date(p.d).getTime());
  const vs=pts.map(p=>p.v);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), span=(x1-x0)||1;
  const mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const pad=((mx-mn)||Math.max(1,Math.abs(mx)*0.04))*0.18;
  const step=niceStep((mx+pad)-(mn-pad),4);
  const lo=Math.floor((mn-pad)/step)*step, hi=Math.ceil((mx+pad)/step)*step;
  const X=t=>pl+((t-x0)/span)*(W-pl-pr);
  const Y=v=>H-pb-((v-lo)/((hi-lo)||1))*(H-pt-pb);
  const fmt=n=>{const r=Math.round(n*100)/100; return decimals||step<1? r.toFixed(1) : String(Math.round(r));};
  const lines=[];
  for(let v=lo; v<=hi+1e-9; v+=step){
    const y=Y(v).toFixed(1);
    lines.push(`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-width="0.6" opacity="0.55"/>`);
    lines.push(`<text x="${pl-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="ui-monospace,monospace">${fmt(v)}</text>`);
  }
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area=`M${X(x0).toFixed(1)},${H-pb} `+pts.map((p,i)=>`L${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ")+` L${X(x1).toFixed(1)},${H-pb} Z`;
  const marks=pts.length>40?[0,pts.length-1]:pts.map((_,i)=>i);
  const dfmt=t=>new Date(t).toLocaleDateString("en-NZ",{month:"short",year:"2-digit"});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Trend chart">
    ${lines.join("")}
    <path d="${area}" fill="var(--brass)" opacity="0.10"/>
    <path d="${d}" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks.map(i=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(pts[i].v).toFixed(1)}" r="2.2" fill="var(--chalk)"/>`).join("")}
    <text x="${pl}" y="${H-5}" font-size="8.5" fill="var(--mute)" font-family="ui-monospace,monospace">${dfmt(x0)}</text>
    <text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="ui-monospace,monospace">${dfmt(x1)}</text>
  </svg>
  <div class="mono mute" style="font-size:10.5px;text-align:right">${unit}</div>`;
}
function rangeTabs(current,fn){
  return `<div class="tabs">${RANGES.map(([l,d])=>`<button class="${current===d?"on":""}" onclick="${fn}(${d})">${l}</button>`).join("")}</div>`;
}

      ${latest&&first&&latest!==first?`<div class="pill">${(latest.kg-first.kg>0?"+":"")}${(latest.kg-first.kg).toFixed(1)} kg since ${first.date}</div>`:""}

    ${b.length?`<div style="margin-top:10px">${b.slice(0,8).map(x=>`<div class="list-item"><span class="mono mute" style="font-size:12px">${x.date}</span><span class="mono">${x.kg} kg</span></div>`).join("")}</div>`:""}
  </div>

    <div class="eyebrow" style="margin-bottom:6px">Training defaults</div>
    <label class="fl">Fallback rest timer (seconds, 0 turns it off)</label>
    <input inputmode="numeric" value="${S.settings.restSec}" onchange="S.settings.restSec=parseInt(this.value)||0;save()">

      <option value="kg" ${S.settings.unit==="kg"?"selected":""}>Kilograms</option>

  ${(()=>{const lb=S.settings.lastBackup;
    const days=lb?daysAgo(lb):null;
    if(days!==null&&days<30) return "";

    return `<div class="card" style="border-color:#5a4030;background:#241a14">
      <div class="eyebrow" style="color:var(--warn);margin-bottom:4px">Back up your data</div>
      <div style="font-size:13.5px">${lb?`Last backup was ${days} days ago.`:"You haven't saved a backup yet."} Your ${S.workouts.length} workouts live only on this device.</div>

  <div class="card">
    <div class="eyebrow" style="margin-bottom:8px">Your data</div>
    <button class="btn wide pri" onclick="loadProgram()">Load my PPL programme</button>
    <p class="mute" style="font-size:12px;margin:6px 0 10px">Creates Push, Pull and Legs + Chest, and sets rest, increment and rep range on all 20 exercises. Replaces routines with the same names; never touches logged history.</p>
    <button class="btn wide" onclick="backupJSON()">Save a full backup file</button>

    <button class="btn wide" onclick="restoreSheet()">Restore from a backup file</button>
    <button class="btn wide" style="margin-top:8px" onclick="exportCSV()">Export workouts as CSV</button>

    <p class="mute" style="font-size:12px;margin-bottom:0">${S.exercises.length} exercises · ${S.routines.length} routines · ${S.workouts.length} workouts</p>

function logBody(){
  const v=parseFloat(document.getElementById("bw").value);
  if(isNaN(v)){toast("Enter a number in kilograms");return;}
  S.body=S.body.filter(x=>x.date!==todayISO());
  S.body.push({date:todayISO(),kg:Math.round(v*10)/10});save();render();toast("Bodyweight logged");
}
function exportCSV(){
  const rows=[["date","workout","exercise","set_index","set_type","weight_kg","reps","est_1rm_kg"]];
  S.workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>
    w.entries.forEach(en=>en.sets.forEach((s,i)=>
      rows.push([w.date,w.name,ex(en.exerciseId).name,i+1,s.type,s.weight,s.reps,Math.round(e1rm(+s.weight||0,+s.reps||0)*10)/10]))));
  S.body.forEach(b=>rows.push([b.date,"Bodyweight","Bodyweight",1,"body",b.kg,"",""]));
  const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`ironlog-${todayISO()}.csv`;a.click();toast("CSV downloaded");
}
function backupJSON(){
  const payload={format:"ironlog-backup",version:1,exported:new Date().toISOString(),data:S};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:"application/json"}));
  a.download=`ironlog-backup-${todayISO()}.json`;a.click();
  S.settings.lastBackup=todayISO(); save();
  toast("Backup saved to your downloads");
}
function restoreSheet(){
  openSheet(`<h2>Restore from a backup</h2>
  <p class="mute" style="font-size:13px">Pick a backup file, or paste its contents. This replaces everything currently in the app, so take a fresh backup first if you have logged anything since.</p>
  <input type="file" accept=".json,application/json" id="bfile" onchange="readBackupFile(this)">
  <label class="fl">Or paste the file contents</label>
  <textarea id="bpaste" rows="5" placeholder='{"format":"ironlog-backup",...}'></textarea>
  <button class="btn wide pri" style="margin-top:10px" onclick="runRestore(document.getElementById('bpaste').value)">Restore</button>
  <button class="btn wide" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
}
function readBackupFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{document.getElementById("bpaste").value=r.result;toast("File loaded — tap Restore");};
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(f);
}
function runRestore(txt){
  if(!txt||!txt.trim()){toast("Choose a file or paste the contents first");return;}
  let p; try{p=JSON.parse(txt);}catch(e){toast("That isn't a valid backup file");return;}
  const d=p&&p.format==="ironlog-backup"?p.data:p;
  if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.exercises)){toast("That file isn't an Ironlog backup");return;}
  const n=d.workouts.length,r=(d.routines||[]).length;
  if(!confirm(`Restore ${n} workouts and ${r} routines? This replaces everything currently in the app.`))return;
  S={exercises:d.exercises,routines:d.routines||[],workouts:d.workouts,body:d.body||[],
     settings:d.settings||{restSec:120,unit:"kg"},active:d.active||null};
  save();closeSheet();go("history");toast(`Restored ${n} workouts`);
}
function importSheet(){
  openSheet(`<h2>Import a Hevy CSV</h2>
  <p class="mute" style="font-size:13px">Paste the contents of a Hevy export below. Exercise names that don't match your library get created automatically.</p>
  <input type="file" accept=".csv,text/csv" id="hfile" onchange="readHevyFile(this)">
  <label class="fl">Or paste the contents</label>
  <textarea id="imp" rows="6" placeholder="title,start_time,exercise_title,set_index,set_type,weight_kg,reps"></textarea>
  <button class="btn wide pri" style="margin-top:10px" onclick="runImport()">Import</button>
  <button class="btn wide" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
}
function measureSheet(){
  openSheet(`<h2>Import measurements</h2>
  <p class="mute" style="font-size:13px">Pick your Hevy measurements export. Ironlog tracks bodyweight, so the weight column is imported and other measurements are ignored. Existing entries on the same date are replaced.</p>
  <input type="file" accept=".csv,text/csv" id="mfile" onchange="readMeasureFile(this)">
  <label class="fl">Or paste the contents</label>
  <textarea id="mimp" rows="6" placeholder="date,weight_kg,fat_percent"></textarea>
  <button class="btn wide pri" style="margin-top:10px" onclick="runMeasureImport()">Import</button>
  <button class="btn wide" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
}
function readMeasureFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{document.getElementById("mimp").value=r.result;toast("File loaded \u2014 tap Import");};
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(f);
}
function runMeasureImport(){
  const raw=document.getElementById("mimp").value.trim();
  if(!raw){toast("Choose a file or paste the CSV first");return;}
  const rows=parseCSV(raw), head=rows.shift().map(h=>h.trim().toLowerCase().replace(/^"|"$/g,""));
  const find=(...pats)=>{
    for(const p of pats){ const i=head.findIndex(h=>h===p); if(i>=0) return i; }
    for(const p of pats){ const i=head.findIndex(h=>h.includes(p)); if(i>=0) return i; }
    return -1;
  };
  const cD=find("date","start_time","time","timestamp");
  let cW=find("weight_kg","bodyweight_kg","weight","bodyweight","mass");
  const lbCol=cW>=0 && /lb|pound/.test(head[cW]);
  if(cD<0||cW<0){toast("Couldn't find date and weight columns");return;}
  const seen={}; let n=0,skipped=0;
  rows.forEach(r=>{
    const date=hevyDate(r[cD]); const v=parseFloat(r[cW]);
    if(!date||isNaN(v)||v<=0){skipped++;return;}
    seen[date]=lbCol?LB2KG(v):v; n++;
  });
  const dates=Object.keys(seen);
  if(!dates.length){toast("No usable rows found");return;}
  S.body=S.body.filter(b=>!seen[b.date]);
  dates.forEach(d=>S.body.push({date:d,kg:Math.round(seen[d]*10)/10}));
  S.body.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeSheet();go("settings");
  toast(`${dates.length} weigh-ins imported${skipped?` \u00b7 ${skipped} rows skipped`:""}`);
}
function readHevyFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{document.getElementById("imp").value=r.result;toast("File loaded \u2014 tap Import");};
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(f);
}
function parseCSV(t){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);cur="";rows.push(row);row=[];}
    else if(c!=="\r")cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c!==""));
}
function hevyDate(str){
  if(!str) return null;
  const iso=(str.match(/\d{4}-\d{2}-\d{2}/)||[])[0];
  if(iso) return iso;
  const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m=str.match(/([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})/);
  if(m && M[m[1].toLowerCase()]!=null){
    const d=new Date(Date.UTC(+m[3],M[m[1].toLowerCase()],+m[2]));
    return d.toISOString().slice(0,10);
  }
  const d=new Date(str);
  return isNaN(d)?null:d.toISOString().slice(0,10);
}
function cleanName(n){
  return n.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+-\s+.*$/,"").replace(/\s+/g," ").trim();
}
function guessMuscle(n){
  const t=n.toLowerCase();
  const map=[[/lateral raise|side delt/,"Side Delts"],[/rear delt|reverse fly|face pull/,"Rear Delts"],
    [/shoulder press|overhead press|arnold|front raise|shrug press/,"Front Delts"],[/shrug/,"Traps"],
    [/curl/,"Biceps"],[/tricep|pushdown|skull|kickback|dip/,"Triceps"],
    [/chest|bench|fly|pec|push up/,"Chest"],[/row|pulldown|pull up|chin up|lat /,"Back"],
    [/squat|leg press|lunge|leg extension|hack/,"Quads"],[/deadlift|leg curl|hamstring|good morning/,"Hamstrings"],
    [/hip thrust|glute/,"Glutes"],[/calf/,"Calves"],[/ab |crunch|plank|core|leg raise/,"Core"],
    [/forearm|wrist|grip/,"Forearms"]];
  for(const [re,m] of map) if(re.test(t)) return m;
  return "Other";
}
function matchExercise(rawName){
  const clean=cleanName(rawName);
  let e=S.exercises.find(x=>x.name.toLowerCase()===rawName.toLowerCase())
     || S.exercises.find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(e) return e;
  const eqm=rawName.match(/\(([^)]*)\)/);
  const primary=guessMuscle(clean);
  e={id:uid(),name:clean||rawName,muscles:[primary],primary,
     equipment:eqm?eqm[1]:"Imported",unit:"kg",rest:defaultRest(clean,primary),
     inc:/Squat|Deadlift|Leg Press|Hip Thrust|Lunge|Hack|Calf/i.test(clean)?5:2.5,custom:true};
  S.exercises.push(e);
  return e;
}
function runImport(){
  const raw=document.getElementById("imp").value.trim();
  if(!raw){toast("Choose a file or paste the CSV first");return;}
  const rows=parseCSV(raw), head=rows.shift().map(h=>h.trim().toLowerCase().replace(/^"|"$/g,""));
  const col=(...names)=>{for(const n of names){const i=head.indexOf(n);if(i>=0)return i;}return -1;};
  const cT=col("title","workout_name"),cD=col("start_time","date"),cEnd=col("end_time"),
        cE=col("exercise_title","exercise_name","exercise"),cType=col("set_type"),
        cW=col("weight_kg","weight"),cR=col("reps"),cSS=col("superset_id"),cN=col("exercise_notes");
  if(cE<0||cR<0){toast("Couldn't find exercise and reps columns");return;}
  const byWorkout={};let n=0,skipped=0,newEx=S.exercises.length;
  rows.forEach(r=>{
    const date=hevyDate(cD>=0?r[cD]:"");
    if(!date){skipped++;return;}
    const name=(cT>=0?r[cT]:"")||"Imported workout";
    const k=date+"|"+name+"|"+(cD>=0?r[cD]:"");
    if(!byWorkout[k]){
      let dur=0;
      if(cEnd>=0&&r[cEnd]){const a=new Date(r[cD]),b=new Date(r[cEnd]);
        if(!isNaN(a)&&!isNaN(b)) dur=Math.max(0,Math.round((b-a)/1000));}
      byWorkout[k]={id:uid(),date,ts:new Date(date).getTime(),name,entries:[],durationSec:dur,imported:true};
    }
    const exName=(r[cE]||"").trim();if(!exName)return;
    const e=matchExercise(exName);
    let en=byWorkout[k].entries.find(x=>x.exerciseId===e.id);
    if(!en){en={exerciseId:e.id,superset:(cSS>=0&&r[cSS]?String(r[cSS]).trim():""),
      sets:[],notes:(cN>=0?(r[cN]||"").trim():"")};byWorkout[k].entries.push(en);}
    const t=(cType>=0?(r[cType]||"").toLowerCase():"normal");
    en.sets.push({type:/warm/.test(t)?"warmup":/drop/.test(t)?"drop":"normal",
      weight:parseFloat(cW>=0?r[cW]:0)||0,reps:parseInt(r[cR])||0,done:true});
    n++;
  });
  const added=Object.values(byWorkout).filter(w=>w.entries.length);
  if(!added.length){toast("Nothing imported \u2014 check the file");return;}
  S.workouts=S.workouts.concat(added);
  newEx=S.exercises.length-newEx;
  save();closeSheet();go("history");
  toast(`${added.length} workouts, ${n} sets, ${newEx} new exercises`);
}

const PROGRAM=[
 {day:"Push",items:[
  ["Incline Bench Press",4,12,8,150,2],
  ["Incline Chest Press",3,8,6,180,5],
  ["Chest Dip",3,12,8,120,2.5],
  ["Shoulder Press",4,12,8,120,2],
  ["Lateral Raise",3,15,12,60,2],
  ["Triceps Pushdown",3,12,8,75,2.5]]},
 {day:"Pull",items:[
  ["T Bar Row",4,8,6,180,2.5],
  ["Lat Pulldown",3,10,8,150,5],
  ["Seated Cable Row",3,12,8,120,5],
  ["Face Pull",3,15,12,60,2.5],
  ["Rear Delt Reverse Fly",3,15,12,60,5],
  ["Hammer Curl",3,12,8,75,2],
  ["Bicep Curl",2,12,8,60,2.5]]},
 {day:"Legs + Chest",items:[
  ["Hack Squat",4,10,8,210,5],
  ["Romanian Deadlift",3,10,8,180,5],
  ["Lying Leg Curl",3,12,8,120,5],
  ["Leg Extension",3,12,8,120,5],
  ["Calf Press",4,12,8,75,5],
  ["Incline Chest Fly",3,12,8,75,2],
  ["Hanging Leg Raise",3,15,12,60,0]]}
];
function loadProgram(){
  if(!confirm("Add the three PPL routines and set rest, increments and rep ranges on every exercise?")) return;
  let made=0;
  PROGRAM.forEach(d=>{
    const items=d.items.map(([name,sets,top,low,rest,inc])=>{
      const e=matchExercise(name);
      e.rest=rest; e.inc=inc; e.repLow=low;
      return {exerciseId:e.id,superset:"",
        sets:Array.from({length:sets},()=>({type:"normal",reps:top}))};
    });
    S.routines=S.routines.filter(r=>r.name!==d.day);
    S.routines.push({id:uid(),name:d.day,items});
    made++;
  });
  save(); closeSheet(); go("routines");
  toast(`${made} routines loaded and tuned`);
}

/* --- sheet --- */
function openSheet(html){document.getElementById("sheetbody").innerHTML=html;document.getElementById("sheet").classList.add("on");}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});

/* --- boot --- */
function fitShell(){
  const vv=(window.visualViewport&&window.visualViewport.height)||0;
  const ih=window.innerHeight||0;
  const de=document.documentElement.clientHeight||0;
  const vals=[vv,ih,de].filter(v=>v>200);
  const h=vals.length?Math.min.apply(null,vals):ih;
  document.documentElement.style.setProperty("--app-h",Math.round(h)+"px");
}
fitShell();
["load","pageshow","resize","orientationchange"].forEach(ev=>window.addEventListener(ev,()=>setTimeout(fitShell,0)));
[80,300,900].forEach(t=>setTimeout(fitShell,t));
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitShell);
  window.visualViewport.addEventListener("scroll",fitShell);
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{await load();render();setInterval(()=>{if(view==="today"&&S.active)render();},60000);})();
</script>
